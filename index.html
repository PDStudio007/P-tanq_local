    <td data-label="${colT}"><div class="pl"><input class="cell-in" type="text" id="nr-chef" data-nr="chef" value="${esc(nr.chef||'')}" placeholder="${tt.n>1?'Chef d’équipe':'Nom du joueur'}" aria-label="${tt.chef}" autocomplete="off">${extra.map(i=>`<input class="cell-in" type="text" data-nr="p${i+1}" value="${esc(nr['p'+(i+1)]||'')}" placeholder="${i+2}ᵉ joueur" aria-label="${i+2}ᵉ joueur" autocomplete="off">`).join('')}</div></td>
    <td data-label="Observations">${selObs(nr.obs||'','data-nr="obs"')}${nr.obs==='Autre'?`<input class="cell-in note" type="text" id="nr-obsNote" data-nr="obsNote" value="${esc(nr.obsNote||'')}" placeholder="Préciser" aria-label="Observation à préciser">`:''}</td>
    ${fee?`<td class="c-pay" data-label="Payé"><label class="mini-switch"><span class="sr">Droit d’inscription payé (${esc(fmtMoney(fee,t.settings.currency))})</span><input type="checkbox" data-nr="paid" ${nr.paid===true?'checked':''}></label></td>`:''}${!st0?'<td class="c-pr"></td>':''}
    <td class="c-a"><button class="btn sm primary" data-act="addRow">${ic('plus')}Ajouter</button></td></tr>`;
  const rows=list.map(x=>{const s=st0?teamStatus(t,x.id,X).st:null;
    return `<tr class="${x.present===false?'absent':''}" data-s="${esc([x.n,x.chef,x.club,...x.players,obsText(x)].join(' ').toLowerCase())}">
    <td class="c-n"><span class="boule sm">${x.n}</span></td>
    <td data-label="Club (Association)">${selClub(x.id,x.club||'',clubs,`data-f="club" data-id="${x.id}"`,`data-f="clubNew" data-id="${x.id}"`,ci)}</td>
    <td data-label="${colT}"><div class="pl"><input class="cell-in" type="text" data-f="chef" data-id="${x.id}" value="${esc(x.chef)}" aria-label="${tt.chef}, équipe ${x.n}" autocomplete="off">${extra.map(i=>`<input class="cell-in" type="text" data-f="p${i+1}" data-id="${x.id}" value="${esc(x.players[i]||'')}" placeholder="${i+2}ᵉ joueur" aria-label="${i+2}ᵉ joueur, équipe ${x.n}" autocomplete="off">`).join('')}</div>${s?`<span class="chip ${s.cls}" style="margin-top:6px">${esc(s.label)}</span>`:''}</td>
    <td data-label="Observations">${selObs(x.obs||'',`data-f="obs" data-id="${x.id}"`)}${x.obs==='Autre'?`<input class="cell-in note" type="text" id="on-${x.id}" data-f="obsNote" data-id="${x.id}" value="${esc(x.obsNote||'')}" placeholder="Préciser" aria-label="Observation à préciser">`:''}</td>
    ${fee?`<td class="c-pay" data-label="Payé"><label class="mini-switch"><span class="sr">Droit d’inscription payé</span><input type="checkbox" data-f="paid" data-id="${x.id}" ${x.paid?'checked':''}></label></td>`:''}
    ${!st0?`<td class="c-pr" data-label="Présente"><label class="mini-switch"><span class="sr">Présente</span><input type="checkbox" data-act="present" data-id="${x.id}" ${x.present!==false?'checked':''}></label></td>`:''}
    <td class="c-a">${st0&&!x.withdrawn?`<button class="btn sm" data-act="absentTeam" data-id="${x.id}" title="Déclarer cette équipe absente">Absente</button>`:''}${st0&&x.withdrawn&&x.withdrawn.mode==='blanc'?`<button class="btn sm" data-act="reinstate" data-id="${x.id}">Réintégrer</button>`:''}${!st0&&sib?`<button class="iconbtn sm" data-act="moveTeam" data-id="${x.id}" aria-label="Transférer l’équipe ${x.n} vers ${esc(sib.name)}" title="Déplacer vers ${esc(sib.name)} (inscription dans le mauvais concours)">${ic('move')}</button>`:''}${!st0?`<button class="iconbtn sm" data-act="delTeam" data-id="${x.id}" aria-label="Retirer l’équipe ${x.n}">${ic('trash')}</button>`:''}</td></tr>`;}).join('');
  return `<div class="insc-h"><h2 class="h2" style="margin:4px 0">Tableau d’inscription <span class="count">${cap?`${t.teams.length} / ${cap} équipes`:t.format==='melee'?plural(t.teams.length,'joueur','joueurs'):plural(t.teams.length,'équipe','équipes')}</span>${!st0&&t.teams.length?`<span class="muted small" style="font-family:Figtree,sans-serif;font-weight:500">${pres} présentes</span>`:''}${ci.cm||nQuota?`<button type="button" class="chip pickq" data-act="quotas" title="Quotas par club">${ci.cm?`${ci.cm} au plus par club`:'Sans limite par club'}${nQuota?`, ${plural(nQuota,'quota particulier','quotas particuliers')}`:''}</button>`:''}${fee?`<span class="chip ${paidN===t.teams.length&&paidN?'ok':''}">Droits : ${paidN}/${t.teams.length} payés, ${fmtMoney(paidN*fee,t.settings.currency)}</span>${t.teams.length?`<button class="btn sm pay-all" type="button" data-act="payAll">${paidN===t.teams.length?'Tout décocher':'Tout payé'}</button>`:''}`:''}</h2><span class="saved muted small" id="autosave" aria-live="polite">Enregistrement automatique</span></div>
  ${!st0&&t.teams.length?actionsCard(t):''}
  <div class="toolbar">${t.teams.length?`<label class="sr" for="q-teams">Rechercher une équipe</label><input id="q-teams" type="search" placeholder="Chercher un nom, un club, un numéro" data-filter="teamrows">`:''}${!st0?`<button class="btn sm primary" data-act="openSaisie">Saisie rapide</button><button class="btn sm" data-act="bulk">${ic('upload')}Importer une liste</button><button class="btn sm" data-act="demoTeams">Équipes fictives</button>`:''}${!st0&&t.teams.length?`<button class="btn sm" data-act="allPresent">Tout pointer présent</button>`:''}${t.teams.length?`<button class="btn sm" data-act="exportCSV">${ic('download')}Exporter la liste (CSV)</button><button class="btn sm" data-act="exportXLSX">${ic('download')}Excel</button>`:''}</div>
  <datalist id="clubs-all">${clubs.map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>
  <div class="tablewrap insc"><table class="insc-t">${head}<tbody id="teamrows">${newRow}${rows}</tbody></table></div>
  ${!t.teams.length?`<p class="note" style="margin-top:12px">Remplissez la première ligne : choisissez le club dans la liste (ou « Nouveau club »), saisissez les joueurs, puis touchez Ajouter ou la touche Entrée. Chaque modification du tableau est enregistrée automatiquement.</p>`:''}`;
}

/* --- À jouer --- */
function chronoOn(t){if(t.format==='melee')return !!(t.settings.meleeTimed&&(t.mrounds||[]).length&&!meleeFinished(t));return t.swissRound>0&&!getB(t,'F')&&!(swissRoundComplete(t)&&t.swissRound>=swissTotal(t));}
function chronoStrip(t){
  const tm=getTimer(t),left=chronoLeft(t);
  return `<section class="chrono-strip ${left===0?'over':''}" aria-label="Chronomètre de la ronde"><div><span class="t" data-chrono>${fmtTime(left)}</span><small>${tm.endAt?'Ronde en cours':(left===0?'Temps écoulé : mène en cours, puis mène supplémentaire':'Chronomètre à l’arrêt')}</small></div>
  <div class="row gap">${tm.endAt?`<button class="btn sm light" data-act="chPause">Pause</button>`:`<button class="btn sm light" data-act="chStart">${left===tm.dur?'Démarrer':'Reprendre'}</button>`}<button class="btn sm light" data-act="chOpen">Grand format</button></div></section>`;
}
function palmares(t){
  const ko=t.brackets.filter(b=>b.kind!=='split'&&b.teams.length>1&&bracketWinner(b));
  if(!ko.length)return '';
  return `<section><h2 class="h2">Palmarès</h2><div class="podium">${ko.map(b=>`<div class="pod gold"><span class="rk">Vainqueur, ${esc(b.id==='F'?'phase finale':b.name)}</span>${teamLine(t,bracketWinner(b),{size:''})}</div>`).join('')}</div></section>`;
}
function jouerView(t,X){
  if(!t.started)return `${actionsCard(t)}<div class="empty"><b>Le concours n’a pas encore commencé.</b><br>Inscrivez et pointez les équipes, puis lancez le tirage. Les parties à jouer apparaîtront ici avec leur terrain.</div>`;
  const play=X.filter(x=>isPlayable(x.m)).sort((a,b)=>(a.m.terrain||9999)-(b.m.terrain||9999)||(a.m.ts||0)-(b.m.ts||0));
  const doneAll=X.filter(x=>x.m.done&&!x.m.bye).sort((a,b)=>(b.m.dt||0)-(a.m.dt||0)),lastR=sheetRounds(t).filter(r=>r.xs.some(x=>x.m.done&&!x.m.bye)).pop(),nLast=lastR?lastR.xs.filter(x=>x.m.done&&!x.m.bye).length:0,lim=ui.allRes?doneAll.length:Math.max(12,nLast),recent=doneAll.slice(0,lim);
  const fin=finished(t);
  return `${(t.format==='suisse'||t.format==='melee')&&chronoOn(t)?chronoStrip(t):''}
  ${fin?palmares(t):''}
  ${actionsCard(t)}${simCard(t)}
  <section><h2 class="h2">Parties à jouer <span class="count">${play.length}</span></h2>
  <div class="row gap" style="margin:-4px 0 12px"><button class="btn sm" data-act="bigScreen">Grand écran</button><button class="btn sm" data-act="addIncident">Signaler un incident</button>${t.started?`<button class="btn sm" data-act="roundSheet">${ic('download')}Feuille de match (PDF)</button>`:''}</div>
  ${play.length?`<div class="toolbar"><label class="sr" for="q-play">Trouver une partie</label><input id="q-play" type="search" placeholder="Trouver une équipe ou un club" data-filter="playlist"></div>
  <p class="note" style="margin:0 0 10px">Touchez une partie pour saisir le score. Le numéro sur fond gravier est le terrain attribué.</p>
  <div class="mlist" id="playlist">${play.map(x=>matchRow(t,x,{ctx:true})).join('')}</div>`
  :`<div class="empty">${fin?'<b>Concours terminé.</b> Bravo aux vainqueurs !':(nextActions(t).length?'Aucune partie en attente : passez à l’étape suivante ci-dessus.':'Aucune partie en attente de score.')}</div>`}</section>
  ${recent.length?`<section><h2 class="h2">Derniers résultats <span class="count">${recent.length} sur ${doneAll.length}</span></h2>${lastR&&!ui.allRes?`<p class="note" style="margin:-4px 0 10px">Tous les résultats de ${esc(lastR.label.charAt(0).toLowerCase()+lastR.label.slice(1))} sont affichés, du plus récent au plus ancien.</p>`:''}<div class="mlist">${recent.map(x=>matchRow(t,x,{ctx:true})).join('')}</div>${doneAll.length>recent.length?`<button class="btn sm" style="margin-top:10px" data-act="allRes">Afficher tous les résultats (${doneAll.length})</button>`:ui.allRes&&doneAll.length>12?`<button class="btn sm" style="margin-top:10px" data-act="allRes">Réduire la liste</button>`:''}</section>`:''}`;
}

/* --- Tableaux --- */
function podiumHTML(t,b){
  const w=bracketWinner(b);if(!w||b.teams.length<2)return '';
  const last=b.rounds[b.rounds.length-1];const fm=last.matches.find(m=>!m.bye);const fin=fm?loserOf(fm):null;
  const prev=b.rounds.length>1?b.rounds[b.rounds.length-2]:null;
  const semis=prev&&prev.matches.length<=2?prev.matches.map(loserOf).filter(Boolean):[];
  return `<div class="podium"><div class="pod gold"><span class="rk">Vainqueur</span>${teamLine(t,w,{size:''})}</div>${fin?`<div class="pod"><span class="rk">Finaliste</span>${teamLine(t,fin,{size:''})}</div>`:''}${semis.length?`<div class="pod"><span class="rk">Demi-finalistes</span>${semis.map(id=>teamLine(t,id)).join('')}</div>`:''}</div>`;
}
function bracketHTML(t,b,XM){
  const w=bracketWinner(b);
  let chip;
  if(b.kind==='split')chip=getB(t,'A')?'<span class="chip ok">Terminée</span>':'<span class="chip live">En cours</span>';
  else if(w)chip=`<span class="chip gold">Vainqueur : ${esc(teamName(t,w))}</span>`;
  else chip='<span class="chip live">En cours</span>';
  const desc=bracketDesc(b);
  return `<section class="bk"><div class="bk-h"><h2 class="h2">${esc(b.name)}</h2>${chip}</div>${desc?`<p class="note" style="margin:-4px 0 10px">${desc}</p>`:''}
  ${podiumHTML(t,b)}
  ${b.rounds.length?`<div class="bracket">${b.rounds.map(r=>`<div class="bcol"><div class="bcol-h">${esc(r.label)}<small>${r.points} points, ${plural(r.matches.length,'partie','parties')}</small></div><div class="bcol-m">${r.matches.map(m=>matchRow(t,XM.get(m.id))).join('')}</div></div>`).join('')}</div>`
  :`<p class="muted">${b.teams.length===1?`Une seule équipe dans ce concours : ${esc(teamName(t,b.teams[0]))} le remporte.`:'Aucune équipe dans ce concours.'}</p>`}</section>`;
}
function tableauxView(t,X){
  if(!t.started)return `${actionsCard(t)}<div class="empty"><b>Aucun tableau pour l’instant.</b><br>Après le tirage, vous verrez ici la 1ʳᵉ partie puis les concours A et B${t.settings.concoursC||t.settings.concoursD?', ainsi que les concours secondaires':''}.</div>`;
  const XM=new Map(X.map(x=>[x.m.id,x]));
  const order=['A','B','C','D','P1'];
  const bs=t.brackets.slice().sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  return `${actionsCard(t)}${simCard(t)}${bs.map(b=>bracketHTML(t,b,XM)).join('')}`;
}

/* --- Poules --- */
function poolCard(t,p,XM){
  const r=poolResult(p);const ids=p.order||p.teams;
  const Fb=getB(t,'F'),pq=planFromPools(t).qm;
  const tag=id=>{
    if(Fb&&Fb.qualRank){if(Fb.teams.includes(id))return `<span class="chip ok">${Fb.qualRank[id]===3?'Repêchée (3ᵉ)':Fb.qualRank[id]===2?'Qualifiée 2ᵉ':'Qualifiée 1ʳᵉ'}</span>`;if(r.done)return '<span class="chip bad">Éliminée</span>';}
    if(!Fb&&pq.mode==='meilleurs2'&&id===r.q2)return '<span class="chip">2ᵉ, à départager</span>';
    if(!Fb&&pq.mode==='repechage'&&p.m&&p.m.bar&&p.m.bar.done&&id===loserOf(p.m.bar))return '<span class="chip">3ᵉ, repêchable</span>';
    if(id===r.q1)return '<span class="chip ok">Qualifiée 1ʳᵉ</span>';
    if(id===r.q2)return '<span class="chip ok">Qualifiée 2ᵉ</span>';
    if(r.out.includes(id))return '<span class="chip bad">Éliminée</span>';
    if(p.order&&p.order.length===3&&id===p.order[2])return '<span class="chip">En blanc à la 1ʳᵉ partie</span>';
    return '';
  };
  const status=!p.m?'Parties à tirer':(r.done?'Terminée':'En cours');
  return `<article class="pool"><div class="pool-h"><span class="pool-letter">${p.name}</span><div class="grow"><b>Poule ${p.name}</b><div class="muted small">${plural(p.teams.length,'équipe','équipes')}</div></div><span class="chip ${r.done?'ok':(p.m?'live':'')}">${status}</span>${t.settings.avoidClub&&groupClash(t,[p.teams])?'<span class="chip bad">Même club</span>':''}</div>
  <ul class="pool-teams">${ids.map(id=>`<li>${teamLine(t,id)}${tag(id)}</li>`).join('')}</ul>
  ${p.m?`<div class="pool-ms">${POOLKEYS.filter(k=>p.m[k]&&k!=='p2').map(k=>{
    const ms=k==='p1'?[p.m.p1,p.m.p2].filter(Boolean):[p.m[k]];
    return `<div><span class="pm-l">${POOLLBL[k]}</span><div style="display:grid;gap:6px">${ms.map(m=>matchRow(t,XM.get(m.id))).join('')}</div></div>`;}).join('')}</div>`:''}
  </article>`;
}
function poulesView(t,X){
  if(!t.pools)return `${actionsCard(t)}<div class="empty"><b>Les poules ne sont pas encore formées.</b><br>Le tirage répartit les équipes présentes en poules de 4 (quelques poules de 3 si le nombre ne tombe pas juste), en séparant si possible les équipes d’un même club.</div>`;
  const XM=new Map(X.map(x=>[x.m.id,x]));
  const done=t.pools.filter(p=>poolResult(p).done).length;
  return `${actionsCard(t)}${simCard(t)}
  <h2 class="h2">Poules <span class="count">${done} / ${t.pools.length} terminées</span></h2>
  <p class="note" style="margin:-4px 0 14px">Gagnants contre gagnants (le vainqueur sort 1ᵉʳ), perdants contre perdants (le perdant est éliminé), puis barrage entre les deux autres. Dans une poule de 3, l’équipe en blanc est considérée gagnante de la 1ʳᵉ partie.</p>
  <div class="pools">${t.pools.map(p=>poolCard(t,p,XM)).join('')}</div>`;
}

/* --- Classement suisse --- */
function classementView(t,X){
  const s=t.settings;
  if(!t.groups&&smode(t)!=='poules')return `${actionsCard(t)}<div class="empty"><b>Le concours n’a pas commencé.</b><br>${esc(SMODES[smode(t)])} : le tirage de la 1ʳᵉ ronde se fait depuis l’onglet Équipes ou ici.</div>${tbCard(t)}`;
  if(!t.groups)return `${actionsCard(t)}<div class="empty"><b>Les poules ne sont pas encore formées.</b><br>Le tirage répartit les équipes en poules de 4 à 8, avec un nombre de poules (1, 2, 4, 8, 16…) qui donne un tableau final sans exempte. Dans chaque poule, chaque équipe rencontre toutes les autres, au chronomètre (${s.duration} minutes par ronde), gagnant contre gagnant.</div>${tbCard(t)}`;
  const XM=new Map(X.map(x=>[x.m.id,x]));const F=getB(t,'F');
  return `${chronoOn(t)?chronoStrip(t):''}${actionsCard(t)}${simCard(t)}
  <p class="note">Ronde ${t.swissRound} sur ${swissTotal(t)}. ${{poules:'Chaque équipe rencontre toutes les autres de sa poule ; les 2 premières (surlignées) se qualifient.',classique:'Gagnant contre gagnant, sans revanche.'+(finalQ(t)?` Les ${finalQ(t)} premières (surlignées) iront en phase finale.`:' Le classement final fait foi.'),championnat:'Chaque équipe rencontre toutes les autres.'+(finalQ(t)?` Les ${finalQ(t)} premières (surlignées) iront en phase finale.`:''),complet:'Les équipes au même parcours se rencontrent : toutes les places sont disputées.'}[smode(t)]}</p>
  ${t.groups.map(g=>{const st=groupRanking(t,g);const q=smode(t)==='poules'?2:finalQ(t),cpl=smode(t)==='complet';
    return `<section><h2 class="h2">${g.name?'Poule '+g.name:'Classement général'} <span class="count">${plural(g.teams.length,'équipe','équipes')}</span></h2>
    <div class="tablewrap"><table><thead><tr><th>Rg</th><th class="l">Équipe</th><th>J</th><th>V</th><th>D</th>${cpl?'<th class="l">Parcours</th>':'<th title="Buchholz">BH</th><th title="Buchholz avancé">BH+</th>'}<th title="Goal-average">Diff</th><th title="Points marqués">PM</th></tr></thead>
    <tbody>${st.map((x,i)=>`<tr class="${i<q&&t.swissRound>0?'q':''}"><td class="rk">${i+1}</td><td class="l">${teamLine(t,x.id)}</td><td>${x.j}</td><td><b class="v">${x.w}</b></td><td>${x.l}</td>${cpl?`<td class="l" style="letter-spacing:.08em">${(x.path||'').replace(/W/g,'✓').replace(/L/g,'✗')}</td>`:`<td>${x.bh}</td><td>${x.bhf}</td>`}<td>${x.diff>0?'+':''}${x.diff}</td><td>${x.pf}</td></tr>`).join('')}</tbody></table></div>
    ${smode(t)==='poules'||(smode(t)==='championnat'&&g.teams.length<=16)?rrGrid(t,g):''}
    ${g.rounds.length?`<details><summary>Rencontres${g.name?' de la poule '+g.name:''}, ronde par ronde</summary>${g.rounds.map((r,ri)=>r.matches.length?`<span class="pm-l">Ronde ${ri+1}</span><div class="mlist">${r.matches.map(m=>matchRow(t,XM.get(m.id))).join('')}</div>`:'').join('')}</details>`:''}
    </section>`;}).join('')}
  ${tbCard(t)}`;
}
function tbCard(t){
  const tb=t.settings.tiebreaks,off=Object.keys(TB).filter(k=>!tb.includes(k));
  return `<section class="card" style="margin-top:26px"><h2 class="h3">Critères de départage</h2><p class="note" style="margin:0">Le nombre de victoires passe toujours en premier. En cas d’égalité, ces critères s’appliquent dans l’ordre. Quand tout le monde se rencontre dans la poule, deux équipes à égalité de victoires ont le même Buchholz : c’est alors le critère suivant qui les départage.</p>
  <ol class="tb">${tb.map((k,i)=>`<li><div><b>${TB[k].label}</b><small>${TB[k].desc}</small></div><button class="iconbtn sm" data-act="tbMove" data-k="${k}" data-d="-1" ${i===0?'disabled':''} aria-label="Monter ${TB[k].label}">${ic('up')}</button><button class="iconbtn sm" data-act="tbMove" data-k="${k}" data-d="1" ${i===tb.length-1?'disabled':''} aria-label="Descendre ${TB[k].label}">${ic('down')}</button><button class="iconbtn sm" data-act="tbOff" data-k="${k}" aria-label="Retirer ${TB[k].label}">${ic('x')}</button></li>`).join('')}</ol>
  ${off.length?`<p class="note" style="margin:12px 0 6px">Critères non utilisés :</p><div class="row gap">${off.map(k=>`<button class="btn sm" data-act="tbOn" data-k="${k}">${ic('plus')}${TB[k].label}</button>`).join('')}</div>`:''}</section>`;
}

/* --- Phase finale --- */
function finaleView(t,X){
  const F=getB(t,'F'),s=t.settings;
  if(t.format==='suisse'&&smode(t)!=='poules'&&!F&&finalQ(t))return `${actionsCard(t)}<div class="empty"><b>La phase finale n’a pas commencé.</b><br>Après la dernière ronde, les ${finalQ(t)} premières du classement sont placées en tableau : la 1ʳᵉ contre la ${finalQ(t)}ᵉ, la 2ᵉ contre la ${finalQ(t)-1}ᵉ, et ainsi de suite.</div>`;
  if(!F){
    const txt=t.format==='poules'

  try{const now=actx.currentTime;[0,.35,.7,1.3].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain(),len=i===3?.8:.25;o.type='square';o.frequency.value=i===3?660:880;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.22,now+d+.02);g.gain.exponentialRampToValueAtTime(.0001,now+d+len);o.connect(g).connect(actx.destination);o.start(now+d);o.stop(now+d+len+.05);});}catch(e){}

function pdfDoc(){
  const pages=[];

    page(o){const c=pdfCanvas();c.W=o&&o.landscape?841.89:595.28;c.H=o&&o.landscape?595.28:841.89;pages.push(c);return c;},
    build(title){

      objs[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${6+2*i} 0 R`).join(' ')}] /Count ${n} >>`;
      objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      objs[5]=`<< /Title ${pdfLit(winCodes(title))} /Creator (P-tanq Carreau) /Producer (P-tanq Carreau) >>`;
      pages.forEach((p,i)=>{const s=p.stream();
        objs[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.W||595.28} ${p.H||841.89}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${7+2*i} 0 R >>`;

      let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];

      const xref=out.length;
      out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;return bytes;
    }

}

/* ============ Équipes absentes : partie à blanc ou nouveau tirage ============ */
const ABS_TYPE='Équipe absente ou retirée du concours';
const isWd=(t,id)=>{const x=t.teams.find(y=>y.id===id);return !!(x&&x.withdrawn);};

  if(t.format==='melee'){const r=(t.mrounds||[])[t.mrounds.length-1];return r&&noScore(r.matches)?{ok:true}:{ok:false,why:'Des scores sont déjà saisis dans la partie en cours.'};}
  if(t.format==='suisse'&&!getB(t,'F')){const g=(t.groups||[]).find(g=>g.teams.includes(id));if(!g)return{ok:false,why:'Équipe introuvable.'};if(t.swissRound===0)return{ok:true};if(t.swissRound!==1)return{ok:false,why:'Le nouveau tirage n’est possible qu’à la 1ʳᵉ ronde ; ensuite, ses parties sont déclarées perdues par forfait.'};return noScore(g.rounds[0].matches)?{ok:true}:{ok:false,why:'Des scores sont déjà saisis dans la 1ʳᵉ ronde de sa poule.'};}

function withdrawTeam(t,id,mode){

    else if(t.format==='suisse'&&!getB(t,'F')){const g=t.groups.find(g=>g.teams.includes(id));g.teams=g.teams.filter(y=>y!==id);if(t.swissRound===0){done=g.name?`retirée de la poule ${g.name} avant la 1ʳᵉ ronde`:'retirée avant la 1ʳᵉ ronde';}else{g.rounds=[];if(g.schedule)g.schedule=rrSchedule(shuffle(g.teams));g.order=null;g.rounds.push(Object.assign(swissPair(t,g,0),{points:+t.settings.points}));done=`nouveau tirage de la 1ʳᵉ ronde${g.name?' de la poule '+g.name:''} sans cette équipe`;}}

/* Parties à blanc : toute partie d’une équipe absente est gagnée par forfait par l’adversaire */

    allMatches(t).forEach(x=>{const m=x.m;if(m.bye&&!m.absent&&x.kind!=='ko'&&m.a&&isWd(t,m.a)){const w=t.teams.find(y=>y.id===m.a).withdrawn;if((m.ts||0)>=w.ts){m.absent=true;m.sa=0;m.sb=0;ch=true;}return;}if(m.done||m.bye||!m.a||!m.b)return;const wa=isWd(t,m.a),wb=isWd(t,m.b);if(!wa&&!wb)return;

/* ============ Feuille de match collective (par ronde ou par tour) ============ */

  if(t.format==='poules'&&t.pools&&t.partiesDrawn)[['1',['p1','p2'],'1ʳᵉ partie des poules'],['2',['w','l'],'2ᵉ partie des poules'],['3',['bar'],'Barrage des poules']].forEach(([k,keys,l])=>{const xs=X.filter(x=>x.kind==='pool'&&keys.includes(x.key)&&x.m.a&&(x.m.b||x.m.bye));if(xs.length)out.push({key:'p'+k,label:l,xs,kind:'pool'});});

  const cum={},addC=(id,my,th,res)=>{const c=cum[id]=cum[id]||{j:0,w:0,l:0,pf:0,pa:0};c.j++;if(res==='G')c.w++;if(res==='P')c.l++;c.pf+=my||0;c.pa+=th||0;};
  const resOf=(m,id)=>{if(!m.done)return['À jouer',null,null];if(m.bye)return['Exempt',m.sa,m.sb];const mine=m.a===id?m.sa:m.sb,th=m.a===id?m.sb:m.sa;return[mine>th?'G':'P',mine,th];};

function validScore(x,sa,sb){
  if(sa==null||sb==null)return 'Saisissez le score des deux équipes.';
  if(sa===sb)return x.timed?'Pas d’égalité possible : jouez une mène supplémentaire pour départager.':'Pas d’égalité possible.';
  const p=x.points;
  if(Math.max(sa,sb)>p)return `Le score ne peut pas dépasser ${p}.`;
  if(!x.timed&&Math.max(sa,sb)!==p)return `Partie en ${p} points : le gagnant doit avoir ${p}.`;
  return '';
}

function askDelete(ids,kind){
  ids=ids.filter(id=>store.tournaments[id]);if(!ids.length)return;
  const one=ids.length===1,t=store.tournaments[ids[0]];
  let title,text;
  if(kind==='journee'){title='Supprimer cette journée\u00a0?';text=`La journée « ${esc(t.jname||t.name)} », ses ${ids.length} concours (${ids.map(id=>esc(store.tournaments[id].name)).join(', ')}) et tous leurs résultats seront supprimés définitivement.`;}
  else if(one){title='Supprimer ce concours\u00a0?';text=`« ${esc(t.name)} »${t.teams.length?`, ses ${plural(t.teams.length,'équipe','équipes')}`:''} et tous ses résultats seront supprimés définitivement. Pour garder une trace, exportez d’abord une sauvegarde depuis les réglages du concours.`;}
  else{title='Supprimer les concours d’essai\u00a0?';text=`${ids.length} concours d’essai et tous leurs résultats seront supprimés définitivement.`;}
  confirmAsk(title,text,'Supprimer',()=>{
    snapTake('Avant suppression : '+ids.map(id=>store.tournaments[id]&&store.tournaments[id].name).filter(Boolean).join(', '));
    ids.forEach(id=>{delete store.tournaments[id];cloudQueue(id);});saveLocal();
    if(ids.includes(ui.tid)){ui.view='home';ui.tid=null;}
    saveUI();render();toast(kind==='journee'?'Journée supprimée':one?'Concours supprimé':`${ids.length} concours supprimés`);
  },true);
}
function confirmAsk(title,text,yes,fn,danger){openSheet({kind:'confirm',title,text,yes,fn,danger});}

  start(){

function repFind(v){

function repParse(text){

  const h=lines[0],sep=h.includes('\t')?'\t':h.includes(';')?';':',',H0=splitCSVLine(h,sep).map(normH);
  const find=(...ks)=>H0.findIndex(x=>ks.some(k=>typeof k==='string'?x===k:k.test(x)));
  const iNom=find('nom','nom de famille'),iPre=find('prenom','prenoms'),iLic=find(/licen[cs]e/),iClub=find(/association/,/club/),iLig=find('ligue'),iVil=find('ville','localite','commune');
  if(iNom<0||iLic<0)return{error:'Colonnes « Nom » et « Licence » introuvables : le fichier doit comporter les colonnes Nom, Prénom, Licence, Association, Ville.'};
  const seen=new Set(),players=[];let noLic=0,dupLic=0;
  lines.slice(1).forEach(l=>{const c=splitCSVLine(l,sep),nom=(c[iNom]||'').trim();if(!nom)return;
    const lic=String(c[iLic]||'').trim().replace(/\.0+$/,'').replace(/\s+/g,'');if(!lic){noLic++;return;}if(seen.has(lic)){dupLic++;return;}seen.add(lic);
    players.push({lic,nom,prenom:iPre>=0?(c[iPre]||'').trim():'',club:iClub>=0?(c[iClub]||'').trim():'',ligue:iLig>=0?(c[iLig]||'').trim():'',ville:iVil>=0?(c[iVil]||'').trim():''});});

  if(!hasEp(t))return{state:'ep',groups:[]};
  if(!t.started)return{state:'wait',groups:[]};
  const all=t.teams.map(x=>x.id).filter(id=>playedTeam(t,id)),G=[];
  const mk=(ep,ids,fn,done)=>G.push({ep,done,engages:all.length,rows:ids.map(id=>({id,stade:fn(id)})).sort((a,b)=>STADES_PRO.indexOf(a.stade)-STADES_PRO.indexOf(b.stade)||((team(t,a.id)||{}).n||0)-((team(t,b.id)||{}).n||0))});
  if(t.format==='elim'){
    const A=getB(t,'A'),B=getB(t,'B'),kA=koStades(A),kB=koStades(B);
    if(t.epreuve==='Concours'){
      const inA=new Set(A?A.teams:[]),inB=new Set(B?B.teams:[]);
      if(A)mk('Concours',all.filter(id=>inA.has(id)),id=>kA.res.get(id)||'Participation',kA.done);
      if(B)mk('Concours2',all.filter(id=>inB.has(id)),id=>kB.res.get(id)||'Participation',kB.done);
    }else mk(t.epreuve,all,id=>kA.res.get(id)||'Participation',kA.done);
  }else if(t.format==='poules'||(t.format==='suisse'&&finalQ(t))){
    const F=getB(t,'F'),kF=koStades(F),q=new Set(F?F.teams:[]);
    mk(t.epreuve,all,id=>kF.res.get(id)||(q.has(id)?'Sortie_Poule':'Participation'),kF.done);
  }else{
    const st=t.groups&&t.groups[0]?groupRanking(t,t.groups[0]).filter(x=>x.j>0):[],rk=new Map(st.map((x,i)=>[x.id,i]));
    mk(t.epreuve,all,id=>rk.has(id)?stadeOfRank(rk.get(id)):'Participation',finished(t));
  }
  return{state:'ok',groups:G};
}

/* ---------- Données de la saison ---------- */
function SA(){
  const y=new Date().getFullYear();
  if(!store.saison||typeof store.saison!=='object')store.saison={};
  const s=store.saison;
  if(!Array.isArray(s.ligues))s.ligues=LIGUES_FRMP.map(code=>({code,nom:'',actif:true}));
  ['associations','calendrier','depart','sanctions'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!s.code)s.code=String(y);if(!s.debut)s.debut=`${y}-01-01`;if(!s.fin)s.fin=`${y}-12-31`;
  if(!s.regles||typeof s.regles!=='object')s.regles={meilleurs:0};
  return s;
}
const ligueApp=()=>(store.profile&&store.profile.ligue)||'';
const ligueNom=c=>{const l=SA().ligues.find(x=>x.code===c);return l&&l.nom?l.nom:c;};
const ligueLbl=c=>{const l=SA().ligues.find(x=>x.code===c);return l&&l.nom?`${l.code} · ${l.nom}`:(c||'');};
const assocByCode=c=>SA().associations.find(a=>a.code===String(c||'').trim())||null;
function assocFind(v){const s=String(v||'').trim();if(!s)return null;const A=SA().associations;return A.find(a=>a.code===s)||A.find(a=>normH(a.nom)===normH(s))||A.find(a=>normH(a.code)===normH(s))||null;}
const assocName=v=>{const a=assocFind(v);return a?a.nom:String(v||'').trim();};
const codeOk=c=>/^[A-Z0-9][A-Z0-9_-]{1,19}$/.test(c);
const normCode=c=>String(c||'').trim().toUpperCase().replace(/\s+/g,'');
const dateISO=v=>{const s=String(v||'').trim();if(!s)return '';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  if(/^\d{5}(\.\d+)?$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+Math.round(+s)*86400000);return d.toISOString().slice(0,10);}return '';};
const fmtD=d=>{if(!d)return '';try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}};

function colKey(h){let k=normH(h).replace(/ /g,'_');if(/^(n|no|num|numero)$/.test(k))k='numero';
  const m=k.match(/^(licence|nom|prenom)_?(\d)$/);if(m)return `${m[1]}_${m[2]}`;
  return COL_ALIAS[k]||k;}
const KNOWN_COLS=new Set(['cle','valeur','code','nom','libelle','actif','ville','ligue','statut','association','licence','prenom','sexe','date_naissance','categorie','concours_id','date','heure','lieu','type','prix','niveau','formule','modele','max_equipes','numero','observations','stade','min_equipes','points','valable_du','famille','mode_points','points_associations','concours','debut','fin','motif','licence_1','nom_1','prenom_1','licence_2','nom_2','prenom_2','licence_3','nom_3','prenom_3','saison','telephone','notes']);
function tableFrom(rows){
  for(let i=0;i<Math.min(rows.length,25);i++){const H=(rows[i]||[]).map(colKey);if(H.filter(k=>KNOWN_COLS.has(k)).length>=2){
    const body=rows.slice(i+1).filter(r=>r&&r.some(c=>String(c??'').trim())&&!/^ex\.?$/i.test(String(r[0]??'').trim()));
    return{header:H,objs:body.map(r=>{const o={};H.forEach((k,j)=>{if(k&&!(k in o))o[k]=String(r[j]??'').trim();});return o;}).filter(o=>!/^ex\.?$/i.test(o.numero||''))};}}
  return{header:[],objs:[]};
}
const textRows=text=>String(text||'').replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim()).map(l=>splitCSVLine(l,sepOf(l)));
async function readTables(file){
  const n=file.name||'',out=[];
  if(/\.zip$/i.test(n)){const z=await unzip(await file.arrayBuffer());
    for(const nm of z.names){if(/(^|\/)(__MACOSX|\.)/.test(nm))continue;
      if(/\.csv$|\.txt$/i.test(nm)){const b=await z.get(nm);let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){t=new TextDecoder('windows-1252').decode(b);}out.push({name:nm.split('/').pop(),...tableFrom(textRows(t))});}
      else if(/\.xlsx$/i.test(nm)){const sh=await xlsxSheets(await z.get(nm));sh.forEach(s=>out.push({name:nm.split('/').pop(),sheet:s.name,...tableFrom(s.rows)}));}}
    return out;}
  if(/\.xls$/i.test(n))throw new Error(XLS_MSG);
  if(/\.xlsx$/i.test(n)){(await xlsxSheets(await file.arrayBuffer())).forEach(s=>out.push({name:n,sheet:s.name,...tableFrom(s.rows)}));return out;}
  if(/\.docx$/i.test(n)){out.push({name:n,...tableFrom(textRows(await docxText(await file.arrayBuffer())))});return out;}
  out.push({name:n,...tableFrom(textRows(await readTextSmart(file)))});return out;
}
function kindOf(tb){
  const n=normH((tb.name||'')+' '+(tb.sheet||'')).replace(/ /g,'_'),H=tb.header,has=(...k)=>k.every(x=>H.includes(x));
  if(has('cle','valeur'))return 'paquet';
  if(has('licence_1'))return 'inscriptions';
  if(has('concours_id','date')&&(has('nom')||has('type')))return 'calendrier';
  if(has('type','stade','points'))return 'bareme';
  if(has('code','libelle'))return 'types';
  if(has('licence','type')&&(has('debut')||has('fin')))return 'sanctions';
  if(has('licence','points')&&!has('stade'))return 'depart';
  if(has('licence','nom'))return 'joueurs';
  if(has('code','nom')&&(has('ligue')||has('ville')||/assoc/.test(n)))return 'associations';
  if(has('code','nom'))return 'ligues';
  return null;
}
const KIND_LBL={paquet:'Fiche du paquet',ligues:'Ligues',associations:'Associations',joueurs:'Joueurs',types:'Types d’épreuve',bareme:'Barème',calendrier:'Calendrier',inscriptions:'Inscriptions',depart:'Classement de départ',sanctions:'Sanctions en cours'};

function rowJoueur(o){const lic=String(o.licence||'').trim();if(!lic)return null;const a=assocFind(o.association);

function rowBareme(o){const ty=String(o.type||'').trim();const st=STADES_PRO.find(s=>normH(s)===normH(o.stade))||({vainqueur:'Vainqueur',champion:'Vainqueur',finaliste:'Finaliste',sous_champion:'Finaliste','1_2_finale':'Demi-finale',demi:'Demi-finale','1_4_de_finale':'Quart',quart:'Quart','1_8_de_finale':'Huitieme',huitieme:'Huitieme'})[normH(o.stade).replace(/ /g,'_')];

function baremeFromRows(rows){const tranches=[],bareme=[];rows.forEach(r=>{if(!r)return;if(r.mn!=null)tranches.push({type_epreuve:r.ty,stade:r.st,min_equipes:r.mn,max_equipes:r.mx,points:r.pts,valable_du:r.du});else bareme.push({type_epreuve:r.ty,stade:r.st,points_base:r.pts});});return{at:Date.now(),bareme,tranches,source:'paquet'};}

H.saisonImport=()=>{const i=document.getElementById('sa-file');if(i)i.click();};
async function saisonFiles(files){
  const P={kinds:{},files:[],warn:[],meta:{}};
  try{for(const f of files){P.files.push(f.name);const tbs=await readTables(f);
    tbs.forEach(tb=>{const k=kindOf(tb);if(!k){if(tb.objs.length)P.warn.push(`${tb.name}${tb.sheet?` (${tb.sheet})`:''} : fichier non reconnu, ignoré.`);return;}(P.kinds[k]=P.kinds[k]||[]).push(...tb.objs);});}}
  catch(e){console.error(e);return toast(e&&e.message?e.message:'Lecture impossible.');}
  if(P.kinds.paquet)P.kinds.paquet.forEach(o=>{const k=normH(o.cle).replace(/ /g,'_');if(k)P.meta[k]=o.valeur;});
  const cnt={ligues:'nb_ligues',associations:'nb_associations',joueurs:'nb_joueurs',calendrier:'nb_concours',inscriptions:'nb_inscriptions',bareme:'nb_bareme',depart:'nb_classement',sanctions:'nb_sanctions'};
  Object.entries(cnt).forEach(([k,m])=>{if(P.meta[m]!=null&&P.meta[m]!==''&&+P.meta[m]!==(P.kinds[k]||[]).length)P.warn.push(`${KIND_LBL[k]} : ${(P.kinds[k]||[]).length} lignes lues, ${P.meta[m]} annoncées dans la fiche du paquet.`);});
  if(P.meta.format&&P.meta.format!=='p-tanq-saison')P.warn.push(`Format « ${P.meta.format} » inattendu (attendu : p-tanq-saison).`);
  if(!Object.keys(P.kinds).some(k=>k!=='paquet'))return toast('Aucune donnée reconnue dans ce fichier.');
  P.replace=!!P.kinds.paquet;openSheet({kind:'saisonImp',pending:P});
}

/* ---------- Classement de la ligue (provisoire, calculé sur l’appareil) ---------- */
const enSaison=t=>{const s=SA();return !!t.date&&t.date>=s.debut&&t.date<=s.fin;};
function concoursComptes(){return Object.values(store.tournaments).filter(t=>enSaison(t)&&t.started&&!isFictif(t)&&hasEp(t)&&t.epreuve!==''&&t.format!=='melee').sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
function classementCalc(){
  const s=SA(),N=+s.regles.meilleurs||0,div=s.regles.repartition==='divise',J=new Map(),A=new Map(),lg=ligueApp();
  const pj=(lic,nom,prenom,assoc)=>{if(!J.has(lic))J.set(lic,{lic,nom,prenom,assoc,depart:0,dconc:0,res:[]});return J.get(lic);};
  s.depart.forEach(d=>{const p=REP.byLic&&REP.byLic.get(d.lic),o=pj(d.lic,p?p.nom:d.nom,p?p.prenom:d.prenom,p?(p.assoc||p.club):d.assoc);o.depart+=+d.points||0;o.dconc+=+d.concours||0;});
  const L=concoursComptes(),inconnus=[];
  L.forEach(t=>t.teams.forEach(x=>{const pts=+x.pts||0;if(!pts)return;const ps=proPlayers(x),part=div&&ps.length?Math.round(pts/ps.length*100)/100:pts;
    ps.forEach(p=>{if(!p.ok){inconnus.push({t,name:p.name,pts:part});return;}const r=REP.byLic.get(p.lic),o=pj(p.lic,p.nom,p.prenom,r?(r.assoc||r.club):'');o.res.push({tid:t.id,nom:t.name,date:t.date,pts:part});});
    const a=assocFind(x.club),tl=t.ligue||lg,ok=t.epreuve==='Federale'||(['Concours','Concours2'].includes(t.epreuve)&&a&&(!a.ligue||a.ligue===tl));
    if(a&&ok){if(!A.has(a.code))A.set(a.code,{code:a.code,nom:a.nom,ligue:a.ligue,pts:0,conc:new Set()});const o=A.get(a.code);o.pts+=pts;o.conc.add(t.id);}}));
  const joueurs=[...J.values()].map(o=>{const r=o.res.slice().sort((a,b)=>b.pts-a.pts),kept=N?r.slice(0,N):r;o.saison=Math.round(kept.reduce((m,x)=>m+x.pts,0)*100)/100;o.total=Math.round((o.depart+o.saison)*100)/100;o.nconc=o.res.length+o.dconc;o.kept=new Set(kept.map(x=>x.tid));return o;})
    .filter(o=>o.total>0||o.res.length).sort((a,b)=>b.total-a.total||b.nconc-a.nconc||(a.nom||'').localeCompare(b.nom||''));
  let rk=0,prev=null;joueurs.forEach((o,i)=>{if(o.total!==prev){rk=i+1;prev=o.total;}o.rang=rk;});
  const assocs=[...A.values()].map(o=>({...o,nconc:o.conc.size})).sort((a,b)=>b.pts-a.pts||a.nom.localeCompare(b.nom));rk=0;prev=null;assocs.forEach((o,i)=>{if(o.pts!==prev){rk=i+1;prev=o.pts;}o.rang=rk;});
  return{joueurs,assocs,concours:L,inconnus};
}

  else body=C.concours.length?`<div class="tablewrap"><table><thead><tr><th class="l">Date</th><th class="l">Concours</th><th class="l">Type</th><th>Équipes</th><th class="l">État</th><th class="l">Envoyé à Pro</th></tr></thead><tbody>${C.concours.map(t=>`<tr><td class="l">${esc(fmtD(t.date))}</td><td class="l"><b>${esc(proName(t))}</b></td><td class="l">${esc(EPREUVES[t.epreuve]||t.epreuve)}</td><td>${t.teams.length}</td><td class="l">${finished(t)?'Terminé':'En cours'}</td><td class="l">${t.proExportLe?esc(new Date(t.proExportLe).toLocaleDateString('fr-FR')):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun concours de la saison n’a encore commencé.</div>';
  return `${suiteHead()}<main class="wrap">
    <section class="intro"><h1>Classement</h1><p class="lede">Saison ${esc(s.code)} (${esc(fmtD(s.debut))} au ${esc(fmtD(s.fin))})${ligueApp()?` · ${esc(ligueLbl(ligueApp()))}`:''}. Classement provisoire, calculé sur cet appareil : le classement officiel reste celui de P-Tanq Pro.</p>
    <div class="row gap"><button class="btn primary" data-act="retourPro">${ic('download')}Exporter pour P-Tanq Pro</button><button class="btn" data-act="clExport" data-f="xlsx">${ic('download')}Classement (Excel)</button><button class="btn" data-act="clExport" data-f="csv">${ic('download')}Classement (CSV)</button></div>
    <p class="note" style="margin-top:8px">Règle appliquée : ${s.regles.repartition==='divise'?'les points de l’équipe sont partagés entre ses joueurs':'chaque joueur reçoit les points de son équipe (règlement FRMP, art. 25)'} ; ${+s.regles.meilleurs?`${s.regles.meilleurs} meilleurs résultats retenus`:'tous les résultats comptent'}. À régler dans Saison › Barème.</p></section>
    ${sub}${body}</main>`;

  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(String(s.name||'Feuille'+(i+1)).replace(/[\\\/?*\[\]:]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s.rows,s.widths)}))];
  return zipStore(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ---------- Stockage : IndexedDB (mémoire principale) + copie localStorage ---------- */
const STO={dbp:null,pending:null,timer:null,lsOk:true,lsLight:false,idbOk:true,lastIdb:0,persisted:null,lastSnap:0,snapDirty:0};
function ldb(){
  if(STO.dbp)return STO.dbp;
  STO.dbp=new Promise((res,rej)=>{let r;try{r=indexedDB.open('ptanq-local',1);}catch(e){rej(e);return;}
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{keyPath:'id',autoIncrement:true});};
    r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();STO.dbp=null;};d.onclose=()=>{STO.dbp=null;};res(d);};
    r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB bloquée'));});
  STO.dbp.catch(()=>{STO.dbp=null;});
  return STO.dbp;
}
function ldbReq(name,mode,fn){return ldb().then(db=>new Promise((res,rej)=>{let tx,rq;try{tx=db.transaction(name,mode);rq=fn(tx.objectStore(name));}catch(e){rej(e);return;}
  tx.oncomplete=()=>res(rq?rq.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abandon'));}));}
const kvGet=k=>ldbReq('kv','readonly',os=>os.get(k));
const kvPut=(k,v)=>ldbReq('kv','readwrite',os=>os.put(v,k));
const snapAll=()=>ldbReq('snaps','readonly',os=>os.getAll());
const snapPut=r=>ldbReq('snaps','readwrite',os=>os.add(r));
const snapDel=id=>ldbReq('snaps','readwrite',os=>os.delete(id));
const snapGet=id=>ldbReq('snaps','readonly',os=>os.get(id));
saveLocal=function(){

};

/* ---------- Instantanés automatiques (20 derniers) ---------- */
const SNAPR=new Map(),SNAP_MAX=20,SNAP_EVERY=15*60000,SNAPL={list:[],est:null};
function roundsDone(t){try{return t&&t.started?sheetRounds(t).filter(r=>r.complete).length+(finished(t)?1:0):0;}catch(e){return 0;}}
function snapSummary(tours){const L=Object.values(tours||{});let eq=0,sc=0;L.forEach(t=>{eq+=(t.teams||[]).length;try{sc+=allMatches(t).filter(x=>x.m.done&&!x.m.bye).length;}catch(e){}});return `${plural(L.length,'concours','concours')}, ${plural(eq,'équipe','équipes')}, ${plural(sc,'score','scores')}`;}
function snapTake(reason){
  let rec;
  try{rec={at:Date.now(),reason:reason||'Instantané',summary:snapSummary(store.tournaments),data:JSON.stringify({tournaments:store.tournaments,profile:store.profile||null})};}catch(e){return Promise.resolve(false);}
  STO.lastSnap=rec.at;STO.snapDirty=store.savedAt||Date.now();
  return snapPut(rec).then(async()=>{const L=(await snapAll()).sort((x,y)=>y.at-x.at);for(const s of L.slice(SNAP_MAX))await snapDel(s.id);return true;})
    .catch(e=>{console.error(e);return false;});
}

  try{const live=Object.values(store.tournaments).some(t=>t.started&&!finished(t));
    if(live&&(store.savedAt||0)>(STO.snapDirty||0)&&Date.now()-(STO.lastSnap||0)>=SNAP_EVERY)snapTake('Instantané automatique (15 minutes de jeu)');}catch(e){}
  majBars();
},60000);

};

function saveToFiles(name,blob){
  const dl=()=>{try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return 'downloaded';}catch(e){return 'error';}};
  let file=null;try{file=new File([blob],name,{type:blob.type||'application/octet-stream'});}catch(e){}
  if(file&&navigator.share&&navigator.canShare){let ok=false;try{ok=navigator.canShare({files:[file]});}catch(e){}
    if(ok)return navigator.share({files:[file],title:name}).then(()=>'shared',e=>e&&e.name==='AbortError'?'cancel':dl());}
  return Promise.resolve(dl());
}

function startTs(t){let m=Infinity;try{allMatches(t).forEach(x=>{if(x.m.ts&&x.m.ts<m)m=x.m.ts;});}catch(e){}return isFinite(m)?m:(t.updatedAt||Date.now());}
function rappelFichiers(){

  const L=store.local||{},last=L.lastFileSave||0,ref=Math.max(last,Math.min(...live.map(startTs)),L.snooze||0);

/* ---------- ZIP (écriture sans compression, lecture avec DecompressionStream) ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files,mime){
  const enc=new TextEncoder(),parts=[],central=[],d=new Date();let off=0;
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,time,true);v.setUint16(12,date,true);
    v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);v.setUint16(28,0,true);lh.set(name,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint16(10,0,true);w.setUint16(12,time,true);w.setUint16(14,date,true);

    async get(name){const f=out.get(name);if(!f)return null;const s=f.lo+30+v.getUint16(f.lo+26,true)+v.getUint16(f.lo+28,true),data=u8.subarray(s,s+f.csize);

    async text(name){const b=await this.get(name);return b?new TextDecoder().decode(b):null;}};
}

function xlsxRows(doc,ss){
  const rows=[];
  for(const r of doc.getElementsByTagName('row')){
    const ri=(+r.getAttribute('r')||rows.length+1)-1,row=[];let ci=0;
    for(const c of r.getElementsByTagName('c')){
      const ix=colIdx(c.getAttribute('r'));if(ix>=0)ci=ix;
      const t=c.getAttribute('t'),ve=c.getElementsByTagName('v')[0];let v='';
      if(t==='s')v=ss[+(ve?ve.textContent:-1)]??'';
      else if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(t==='b')v=ve&&ve.textContent==='1'?'VRAI':'FAUX';
      else if(t==='str'||t==='e')v=ve?ve.textContent:'';
      else{v=ve?ve.textContent:'';if(v!=='')v=numTxt(v);}
      row[ci]=v;ci++;

    rows[ri]=row;
  }
  return Array.from(rows,r=>r?Array.from(r,x=>x??''):[]);
}
async function xlsxSheets(buf){

}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');

/* ---------- Word (.docx) : lecture des tableaux et paragraphes ---------- */
async function docxText(buf){
  const z=await unzip(buf),x=await z.text('word/document.xml');if(!x)throw new Error('Ce fichier n’est pas un document Word (.docx).');
  const d=xmlDoc(x),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',lines=[];
  const ptext=p=>[...p.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('');
  const body=d.getElementsByTagNameNS(W,'body')[0];if(!body)return '';
  for(const el of body.children){
    if(el.localName==='tbl'){for(const tr of el.getElementsByTagNameNS(W,'tr'))lines.push([...tr.children].filter(c=>c.localName==='tc').map(tc=>[...tc.getElementsByTagNameNS(W,'p')].map(ptext).join(' ').replace(/\s+/g,' ').trim()).join('\t'));}
    else if(el.localName==='p'){const s=ptext(el).trim();if(s)lines.push(s);}
  }
  return lines.join('\n');
}

async function readTextSmart(file){const buf=new Uint8Array(await file.arrayBuffer());try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,'');}catch(e){return new TextDecoder('windows-1252').decode(buf);}}
function looksHeader(cells,kind){
  if(kind==='rep'){const H=cells.map(normH);return H.some(h=>h==='nom'||h==='nom de famille')&&H.some(h=>/licen[cs]e/.test(h));}
  const H=cells.map(headKey);return H.includes('chef')||(H.includes('club')&&H.filter(Boolean).length>=2);
}
const sepOf=l=>l.includes('\t')?'\t':l.includes(';')?';':',';
function trimToHeader(text,kind){const lines=String(text||'').replace(/^﻿/,'').split(/\r?\n/);
  for(let i=0;i<Math.min(lines.length,25);i++){const l=lines[i];if(!l.trim())continue;if(looksHeader(splitCSVLine(l,sepOf(l)),kind))return lines.slice(i).join('\n');}
  return text;}
async function xlsxToText(buf,kind){
  const sheets=await xlsxSheets(buf);if(!sheets.length)throw new Error('Classeur vide.');
  const tsv=rows=>rows.map(r=>(r||[]).map(c=>String(c??'').replace(/[\t\r\n]+/g,' ').trim()).join('\t')).join('\n');
  for(const s of sheets)for(let i=0;i<Math.min(s.rows.length,25);i++)if(looksHeader(s.rows[i]||[],kind))return tsv(s.rows.slice(i));
  return tsv(sheets[0].rows);
}
async function fileToTeamsText(file){
  const n=file.name||'';
  if(/\.xls$/i.test(n))throw new Error(XLS_MSG);
  if(/\.doc$/i.test(n))throw new Error('Ancien format Word (.doc) non pris en charge : enregistrez le document au format .docx.');
  if(/\.xlsx$/i.test(n))return xlsxToText(await file.arrayBuffer(),'teams');
  if(/\.docx$/i.test(n))return trimToHeader(await docxText(await file.arrayBuffer()),'teams');
  return trimToHeader(await readTextSmart(file),'teams');
}

/* ---------- Import d’une sauvegarde : fusionner ou remplacer ---------- */
function backupItems(obj){
  if(!obj||typeof obj!=='object')return null;let items=[],source='';
  if(obj.tournaments&&typeof obj.tournaments==='object'){items=Object.values(obj.tournaments);
    source=obj.application==='P-Tanq Local'?`Sauvegarde P-Tanq Local ${obj.version||''}`.trim():obj.application?`Sauvegarde ${obj.application}${obj.version?` (${obj.version})`:''}`:'Sauvegarde complète de Carreau';}
  else if(Array.isArray(obj.teams)){items=[obj];source='Sauvegarde d’un concours';}
  else if(Array.isArray(obj)){items=obj;source='Liste de concours';}
  items=items.filter(x=>x&&typeof x==='object'&&Array.isArray(x.teams));
  return{items,source,date:obj.date||null,repertoire:obj.repertoire&&Array.isArray(obj.repertoire.players)?obj.repertoire:null,profile:obj.profile&&typeof obj.profile==='object'?obj.profile:null};
}
function cleanImported(raw){const t=normalize(JSON.parse(JSON.stringify(raw)));['proSync','baseEnAttente','archiveLe','secoursLe'].forEach(k=>delete t[k]);if(!t.id)t.id='c'+rid();return t;}
importJSON=function(text){
  let obj;try{obj=JSON.parse(String(text||'').replace(/^﻿/,''));}catch(e){return toast('Contenu illisible : choisissez une sauvegarde Carreau (fichier .json).');}
  const P=backupItems(obj);if(!P||(!P.items.length&&!P.saison))return toast('Aucun concours trouvé dans cette sauvegarde.');
  if(!Object.keys(store.tournaments).length)return doImport(P,'merge');
  openSheet({kind:'importChoice',pending:P});
};
async function importFile(file){
  try{
    if(/\.zip$/i.test(file.name||'')){const z=await unzip(await file.arrayBuffer()),j=z.names.find(n=>/\.json$/i.test(n));if(!j)return toast('Aucune sauvegarde (.json) dans ce fichier .zip.');importJSON(await z.text(j));return;}
    importJSON(await readTextSmart(file));
  }catch(e){console.error(e);toast('Lecture du fichier impossible.');}
}
function doImport(P,mode){
  const items=P.items.map(cleanImported);let added=0,updated=0,kept=0;
  if(mode==='replace'){snapTake('Avant remplacement par une sauvegarde importée');store.tournaments={};}
  items.forEach(t=>{const loc=store.tournaments[t.id];if(!loc){store.tournaments[t.id]=t;added++;}else if((t.updatedAt||0)>(loc.updatedAt||0)){store.tournaments[t.id]=t;updated++;}else kept++;});
  let rep='';
  if(P.repertoire&&(mode==='replace'||!store.repertoire||(P.repertoire.importedAt||0)>(store.repertoire.importedAt||0))){store.repertoire=P.repertoire;repBuild();rep=`, répertoire de ${plural(P.repertoire.players.length,'joueur','joueurs')}`;}
  if(P.profile&&(mode==='replace'||!(store.profile&&store.profile.ligue))){const keep=store.profile||{};store.profile={...keep,...P.profile};}
  items.forEach(t=>SNAPR.set(t.id,roundsDone(t)));
  saveLocal();closeSheet();ui.view='home';ui.tid=null;saveUI();render();window.scrollTo(0,0);
  toast(mode==='replace'?`Sauvegarde importée : ${plural(items.length,'concours','concours')}${rep}`:`${[added?plural(added,'concours ajouté','concours ajoutés'):'',updated?plural(updated,'concours mis à jour','concours mis à jour'):'',kept?plural(kept,'concours déjà à jour','concours déjà à jour'):''].filter(Boolean).join(', ')||'Rien à importer'}${rep}`);
}

const PIN={cfg:null,locked:false,last:Date.now(),buf:'',fails:0,until:0,mode:'pin',busy:false};
const PINK='ptanq-local.pin',RESC_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const pinIdle=()=>((PIN.cfg&&+PIN.cfg.idle)||15)*60000;
const pinOk=()=>!!(window.isSecureContext&&window.crypto&&crypto.subtle);
const rescNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function pinLoad(){try{return JSON.parse(localStorage.getItem(PINK)||'null');}catch(e){return null;}}
function pinSaveCfg(c){PIN.cfg=c;try{if(c)localStorage.setItem(PINK,JSON.stringify(c));else localStorage.removeItem(PINK);}catch(e){}kvPut('pin',c?JSON.stringify(c):'').catch(()=>{});}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function randStr(n,alpha){const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(v=>alpha[v%alpha.length]).join('');}
const lockBrand=()=>`<div class="lock-brand"><span class="mark" aria-hidden="true"><span class="boule"></span><span class="cochonnet"></span></span>P-Tanq Local</div>`;
function pinLock(){
  if(!PIN.cfg)return;PIN.locked=true;PIN.buf='';PIN.mode='pin';try{repHide();}catch(e){}
  let el=document.getElementById('lock');
  if(!el){el=document.createElement('div');el.id='lock';el.className='lock-ov';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','P-Tanq Local verrouillé');document.body.appendChild(el);}
  const app=document.getElementById('app');if(app)app.setAttribute('aria-hidden','true');pinPaint();
}
function pinPaint(msg){
  const el=document.getElementById('lock');if(!el||!PIN.cfg)return;
  if(PIN.mode==='rescue'){
    el.innerHTML=`<div class="lock-card">${lockBrand()}<h1 class="lock-h">Code de secours</h1><p class="note" style="margin:0 auto 12px">Saisissez le code de secours noté à la création du code PIN.</p><input id="lock-resc" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" style="text-align:center;font-size:22px;letter-spacing:.06em"><p class="lock-err" role="alert">${msg||''}</p><div class="row gap" style="justify-content:center"><button class="btn primary" data-lock="resc-ok">Déverrouiller</button><button class="btn" data-lock="pin">Revenir au code PIN</button></div></div>`;
    setTimeout(()=>{const i=document.getElementById('lock-resc');if(i)i.focus();},30);return;}
  const n=PIN.cfg.len||4,wait=PIN.until>Date.now();
  el.innerHTML=`<div class="lock-card">${lockBrand()}<h1 class="lock-h">Saisissez votre code PIN</h1>
    <div class="lock-dots" aria-label="${PIN.buf.length} chiffres saisis sur ${n}">${Array.from({length:n},(_,i)=>`<i class="${i<PIN.buf.length?'on':''}"></i>`).join('')}</div>
    <p class="lock-err" role="alert">${msg||(wait?`Trop d’essais : patientez ${Math.ceil((PIN.until-Date.now())/1000)} secondes.`:'')}</p>
    <div class="lock-pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" class="key" data-lock="k" data-k="${k}" ${wait?'disabled':''}>${k}</button>`).join('')}<span></span><button type="button" class="key" data-lock="k" data-k="0" ${wait?'disabled':''}>0</button><button type="button" class="key" data-lock="del" aria-label="Effacer le dernier chiffre">⌫</button></div>
    <button type="button" class="btn sm" style="margin-top:16px" data-lock="rescue">Code PIN oublié : code de secours</button>
    <p class="note" style="margin:14px auto 0">Protection contre l’usage par d’autres personnes. Les données ne sont pas chiffrées.</p></div>`;
  if(wait)setTimeout(()=>{if(PIN.locked&&PIN.mode==='pin')pinPaint();},1000);
}
function pinUnlock(){PIN.locked=false;PIN.fails=0;PIN.until=0;PIN.buf='';PIN.last=Date.now();const el=document.getElementById('lock');if(el)el.remove();const app=document.getElementById('app');if(app)app.removeAttribute('aria-hidden');majBars();}
async function pinCheck(){
  if(PIN.busy)return;PIN.busy=true;const buf=PIN.buf;
  try{const h=await sha256(PIN.cfg.salt+':'+buf);
    if(h===PIN.cfg.hash){pinUnlock();setTimeout(installMaybe,400);return;}
    PIN.fails++;PIN.buf='';if(PIN.fails>=5)PIN.until=Date.now()+30000*(PIN.fails-4);
    const el=document.getElementById('lock');pinPaint('Code incorrect.');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  }finally{PIN.busy=false;}
}
async function pinRescue(){
  const v=rescNorm((document.getElementById('lock-resc')||{}).value);if(!v)return;
  const h=await sha256(PIN.cfg.rsalt+':'+v);
  if(h!==PIN.cfg.rhash){PIN.fails++;return pinPaint('Code de secours incorrect.');}
  pinUnlock();openSheet({kind:'pin',msg:'Code de secours utilisé : choisissez un nouveau code PIN. Un nouveau code de secours vous sera donné.'});
}
function pinKey(k){if(!PIN.cfg||PIN.until>Date.now()||PIN.busy)return;const n=PIN.cfg.len||4;if(PIN.buf.length>=n)return;PIN.buf+=k;pinPaint();if(PIN.buf.length>=n)pinCheck();}
addEventListener('click',e=>{
  if(!PIN.locked)return;const lock=document.getElementById('lock');
  if(!lock||!lock.contains(e.target)){e.stopPropagation();e.preventDefault();return;}
  e.stopPropagation();const b=e.target.closest('[data-lock]');if(!b||b.disabled)return;e.preventDefault();
  const a=b.dataset.lock;
  if(a==='k')pinKey(b.dataset.k);else if(a==='del'){PIN.buf=PIN.buf.slice(0,-1);pinPaint();}
  else if(a==='rescue'){PIN.mode='rescue';pinPaint();}else if(a==='pin'){PIN.mode='pin';PIN.buf='';pinPaint();}
  else if(a==='resc-ok')pinRescue();
},true);
addEventListener('keydown',e=>{
  if(!PIN.locked)return;e.stopPropagation();
  if(PIN.mode==='rescue'){if(e.key==='Enter'){e.preventDefault();pinRescue();}return;}
  if(/^\d$/.test(e.key)){e.preventDefault();pinKey(e.key);}else if(e.key==='Backspace'){e.preventDefault();PIN.buf=PIN.buf.slice(0,-1);pinPaint();}
  else if(e.key!=='Tab')e.preventDefault();
},true);
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>addEventListener(ev,()=>{if(!PIN.locked)PIN.last=Date.now();},{capture:true,passive:true}));
setInterval(()=>{if(PIN.cfg&&!PIN.locked&&Date.now()-PIN.last>pinIdle())pinLock();},10000);

/* ---------- Service worker : hors réseau et mises à jour ---------- */
const SWR={reg:null,update:false,asked:false,ready:false,reloading:false};
async function swReadyCheck(){try{SWR.ready=!!(await caches.match('index.html'));}catch(e){SWR.ready=false;}if(ui.sheet&&(ui.sheet.kind==='backups'||ui.sheet.kind==='install'))renderSheet();}
function swRegister(){
  if(!('serviceWorker' in navigator)||!window.isSecureContext)return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    SWR.reg=reg;const flag=()=>{if(reg.waiting&&navigator.serviceWorker.controller){SWR.update=true;majBars();}};flag();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')flag();if(w.state==='activated')swReadyCheck();});});
    navigator.serviceWorker.ready.then(swReadyCheck);
  }).catch(e=>console.warn('Service worker',e));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{swReadyCheck();if(SWR.asked&&!SWR.reloading){SWR.reloading=true;location.reload();}});
}
H.swReload=async()=>{SWR.asked=true;saveLocal();await flushIdb();const w=SWR.reg&&SWR.reg.waiting;if(w)w.postMessage({type:'SKIP_WAITING'});else location.reload();setTimeout(()=>{if(!SWR.reloading)location.reload();},4000);};

    snapTake(finished(t)?`${t.name} : concours terminé`:`${t.name} : fin de ${R?R.label.charAt(0).toLowerCase()+R.label.slice(1):'tour'}`);}
  if(t.started&&!isFictif(t)&&!t.finFichiersLe&&finished(t)){t.finFichiersLe=Date.now();saveLocal();
    setTimeout(()=>{if(!ui.sheet&&!PIN.locked)confirmAsk('Concours terminé',`${esc(t.name)} est terminé. Enregistrez maintenant la sauvegarde dans Fichiers : elle contient les équipes, les scores et les résultats, et se réimporte à tout moment.`,'Enregistrer dans Fichiers',()=>H.saveFiles());},900);}
};}
{const hv=homeView;homeView=function(){
  let h=hv();const L=store.local||{},lf=L.lastFileSave;
  const bar=`<section class="card bc-card"><div class="rep-head"><h2 class="h3">Barème des points</h2><span class="chip ok">FRMP, article 25</span></div><p class="note">Les points du rapport sont calculés sur cet iPad avec le barème de la FRMP (1er et 2e prix selon le nombre d’équipes engagées, compétition fédérale ; championnat sans points). Super-League : points à saisir dans le rapport.</p><button class="btn" data-act="bareme">Voir le barème</button></section>`;
  const bk=`<section class="card rep-card"><div class="rep-head"><h2 class="h3">Sauvegardes</h2>${lf?`<span class="chip ${Date.now()-lf<30*60000?'ok':''}">Fichiers : ${esc(agoTxt(lf))}</span>`:'<span class="chip live">Jamais enregistré dans Fichiers</span>'}</div><p class="note">Mémoire principale de l’iPad, copie de secours et instantanés automatiques. Enregistrez aussi dans Fichiers pour garder une copie hors de P-Tanq Local.</p><div class="row gap"><button class="btn primary" data-act="saveFiles">${ic('save')}Enregistrer dans Fichiers</button><button class="btn" data-act="backups">${ic('history')}Instantanés et sécurité</button></div></section>`;
  h=h.replace('<p class="sync">',bar+bk+'<p class="sync">');
  if(!isStandalone())h=h.replace('</section>',`</section><section class="card rep-card inst-card"><div class="rep-head"><h2 class="h3">Installer sur l’iPad</h2><span class="chip live">Ouvert dans le navigateur</span></div><p class="note">Ajoutez P-Tanq Local à l’écran d’accueil pour l’utiliser toute la journée sans réseau.</p><button class="btn" data-act="installHelp">Voir comment faire</button></section>`);
  return h;
};}
{const bs=baremeSheet;baremeSheet=function(){return bs()
  .replace('Barème de P-Tanq Pro non chargé (connexion nécessaire) : seul le barème de référence est affiché.','P-Tanq Local applique ce barème de référence pour calculer les points du rapport, sans réseau. À l’import des résultats, P-Tanq Pro applique son propre barème.')
  .replace(', comparés à ceux enregistrés dans P-Tanq Pro','')
  .replace('réglé dans P-Tanq Pro : non chargé','réglé dans P-Tanq Pro ; dans P-Tanq Local, ses points se saisissent dans le rapport');};}
{const r9=render;render=function(){
  r9();
  const top=document.querySelector('#app header.top .top-in');
  if(top&&!top.querySelector('[data-act="saveFiles"]')){const th=top.querySelector('.thsw');
    const html=`<button class="iconbtn" data-act="backups" aria-label="Sauvegardes" title="Sauvegardes">${ic('history')}</button><button class="iconbtn" data-act="saveFiles" aria-label="Enregistrer dans Fichiers" title="Enregistrer dans Fichiers">${ic('save')}</button>`;
    if(th)th.insertAdjacentHTML('beforebegin',html);else top.insertAdjacentHTML('beforeend',html);}
  const m=document.querySelector('#app main.wrap');if(m&&!m.querySelector('.ver.lv'))m.insertAdjacentHTML('beforeend',`<p class="ver lv">${CARREAU_VERSION}</p>`);
  majBars();
};}

/* ---------- Démarrage ---------- */
async function boot(){
  PIN.cfg=pinLoad();if(PIN.cfg)pinLock();
  let a=null,b=null;
  try{a=await kvGet('store');}catch(e){STO.idbOk=false;console.error(e);}
  try{b=localStorage.getItem(LS);}catch(e){}
  if(!PIN.cfg){try{const v=await kvGet('pin');if(v){PIN.cfg=JSON.parse(v);try{localStorage.setItem(PINK,v);}catch(e){}pinLock();}}catch(e){}}
  const stamp=r=>{if(typeof r!=='string')return -1;try{const d=JSON.parse(r);return d&&d.tournaments?(+d.savedAt||0):-1;}catch(e){return -1;}};
  const sa=stamp(a),sb=stamp(b);
  BOOT_RAW=sa<0&&sb<0?null:(sa>=sb?a:b);
  loadLocal();BOOT_RAW=null;
  store.local=store.local&&typeof store.local==='object'?store.local:{};
  if((sa>=0||sb>=0)&&sa!==sb)saveLocal();
  Object.values(store.tournaments).forEach(t=>SNAPR.set(t.id,roundsDone(t)));
  try{STO.lastSnap=(await snapAll()).reduce((m,s)=>Math.max(m,s.at||0),0);STO.snapDirty=store.savedAt||0;}catch(e){}
  render();
  persistAsk();swRegister();
  setTimeout(installMaybe,800);
}

boot();
</script>
