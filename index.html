<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P-Tanq Local · Agenda, Concours, Classement</title>
<meta name="theme-color" content="#184C59">
<meta name="description" content="P-Tanq Local : agenda, concours et classement de la ligue, hors réseau">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P-Tanq Local">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!-- Polices Bebas Neue et Barlow (licence OFL) : chargées une seule fois, à la première ouverture
     avec le réseau, puis servies par le service worker depuis le cache de l’iPad. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFFFF; --surface-2:#F0EBE0; --ink:#2A1C10; --muted:#6F6151; --line:#DED6C9;
  --platane:#184C59; --platane-ink:#FBF8F1; --platane-soft:#DCEBEE; --platane-text:#184C59;
  --buis:#CC6526; --buis-soft:#F8E3D4; --buis-text:#8A3C10; --buis-ink:#FFFBF4;
  --gravier:#EEE7D9; --gravier-ink:#3D2919;
  --ok:#298646; --ok-soft:#DCEFE2; --bad:#CC2827; --bad-soft:#F7DEDC;
  --gold:#DDB049; --gold-ink:#331F05;
  --steel-hi:#F6F8F9; --steel-mid:#AEB7BD; --steel-lo:#5A666D; --steel-ink:#1B2226;
  --shadow:0 1px 2px rgba(42,28,16,.06),0 8px 24px rgba(42,28,16,.08);
  --hh:60px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A160B; --surface:#272114; --surface-2:#342D1F; --ink:#F2EEE6; --muted:#B5AA98; --line:rgba(255,255,255,.12);
    --platane:#3A6E7B; --platane-ink:#F2EEE6; --platane-soft:#1D3238; --platane-text:#86B9C6;
    --buis:#E1773B; --buis-soft:#3B2516; --buis-text:#F0A274; --buis-ink:#110D04;
    --gravier:#342D1F; --gravier-ink:#F2EEE6;
    --ok:#4CA563; --ok-soft:#1B3322; --bad:#EC544B; --bad-soft:#3D1C18;
    --gold:#E4B750; --gold-ink:#1F1306;
    --steel-hi:#E4E9EC; --steel-mid:#9AA4AA; --steel-lo:#47525A; --steel-ink:#12181B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A160B; --surface:#272114; --surface-2:#342D1F; --ink:#F2EEE6; --muted:#B5AA98; --line:rgba(255,255,255,.12);
    --platane:#3A6E7B; --platane-ink:#F2EEE6; --platane-soft:#1D3238; --platane-text:#86B9C6;
    --buis:#E1773B; --buis-soft:#3B2516; --buis-text:#F0A274; --buis-ink:#110D04;
    --gravier:#342D1F; --gravier-ink:#F2EEE6;
    --ok:#4CA563; --ok-soft:#1B3322; --bad:#EC544B; --bad-soft:#3D1C18;
    --gold:#E4B750; --gold-ink:#1F1306;
    --steel-hi:#E4E9EC; --steel-mid:#9AA4AA; --steel-lo:#47525A; --steel-ink:#12181B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Barlow',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--platane)}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
.display,.h2,.h3{font-family:'Bebas Neue','Arial Narrow','Roboto Condensed',sans-serif;letter-spacing:.02em}
.ic{width:20px;height:20px;flex:none}
:focus-visible{outline:3px solid var(--buis);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--platane);color:var(--platane-ink)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:var(--hh)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:30px;line-height:1;padding-left:4px}
.mark{position:relative;width:30px;height:30px}
.mark .boule{--s:26px;position:absolute;left:0;top:2px}
.cochonnet{position:absolute;right:-2px;top:0;width:10px;height:10px;border-radius:50%;background:var(--buis);box-shadow:inset -1px -2px 2px rgba(0,0,0,.25)}
.tt{flex:1;min-width:0;padding:0 4px}
.tt h1{margin:0;font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt p{margin:2px 0 0;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;color:inherit;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(127,127,127,.14)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn.sm{width:36px;height:36px;border-radius:8px}
.spacer{flex:1}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;max-width:1080px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;background:none;border:0;color:var(--muted);font-weight:600;font-size:11.5px;line-height:1.1;position:relative;cursor:pointer;min-width:0}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--platane-text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--platane)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--buis);color:var(--buis-ink);font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
main.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 112px}
@media (min-width:860px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{flex:none;flex-direction:row;gap:8px;padding:13px 18px;font-size:14.5px}
  .tab .ic{width:20px;height:20px}
  .tab[aria-current="page"]::before{top:auto;bottom:-1px;left:12px;right:12px;border-radius:3px 3px 0 0}
  .badge{position:static;margin-left:2px}
  main.wrap{padding:24px 20px 56px}
}

/* Boules */
.boule{--s:38px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(circle at 32% 28%,var(--steel-hi) 0 10%,var(--steel-mid) 48%,var(--steel-lo) 100%);
  box-shadow:inset 0 -2px 5px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.18);
  font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:calc(var(--s)*.46);color:var(--steel-ink);text-shadow:0 1px 0 rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.boule::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(118deg,transparent 0 6px,rgba(255,255,255,.16) 6px 7px)}
.boule.sm{--s:30px}
.boule.lg{--s:56px}
.boule.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.boule.ghost::after{display:none}

/* Typo et blocs */
.intro{padding:22px 0 8px}
.intro h1{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:clamp(48px,11vw,88px);line-height:.92;margin:0;letter-spacing:-.005em}
.lede{font-size:17px;color:var(--muted);max-width:56ch;margin:12px 0 18px}
.h2{font-weight:800;font-size:26px;line-height:1.1;margin:28px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.h3{font-weight:800;font-size:21px;line-height:1.15;margin:0 0 10px}
.count{font-family:'Barlow',ui-sans-serif,system-ui,sans-serif;font-size:13px;font-weight:700;background:var(--platane-soft);color:var(--platane-text);padding:2px 10px;border-radius:999px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:22px 18px;color:var(--muted)}
.empty b{color:var(--ink)}
.note{font-size:14px;color:var(--muted);max-width:70ch}
.sync{font-size:13.5px;color:var(--muted);margin-top:28px}
.err{color:var(--bad);font-weight:600;margin:12px 0 0}
.warn{color:var(--bad)!important}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--platane)}
.btn.primary{background:var(--platane);border-color:var(--platane);color:var(--platane-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px}
.btn.wide{width:100%}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;line-height:1.35}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.live{background:var(--buis-soft);color:var(--buis-text);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.gold{background:var(--buis);color:var(--buis-ink);border-color:transparent}

/* Liste des concours */
.tlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:22px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tcard:hover{border-color:var(--platane)}
.tcard-w{position:relative;display:flex}
.tcard-w .tcard{flex:1;padding-right:100px}
.tcard-w .tcard.jc{padding-right:56px}
.tedit{position:absolute;top:10px;right:54px;color:var(--muted)}
.tedit:hover,.tedit:focus-visible,.jc-edit:hover,.jc-edit:focus-visible{color:var(--platane-text);background:var(--platane-soft)}
.jc-row{display:flex;align-items:stretch;gap:6px;width:100%}
.jc-row .jc-item{flex:1;min-width:0}
.jc-edit{width:44px;height:auto;min-height:44px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:12px}
.tdel{position:absolute;top:10px;right:10px;color:var(--muted)}
.tdel:hover,.tdel:focus-visible{color:var(--bad);background:var(--bad-soft)}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gravier);background-image:radial-gradient(rgba(0,0,0,.14) 1px,transparent 1.3px);background-size:4px 4px}
.tcard-date{font-size:13px;color:var(--muted);font-weight:600}
.tcard-name{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:27px;line-height:1.05}
.tcard-meta{font-size:14px;color:var(--muted);margin-bottom:6px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label,.flabel{font-size:13.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--platane);box-shadow:0 0 0 3px var(--platane-soft)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.grid2{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:10px 6px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);box-shadow:var(--shadow);color:var(--platane-text)}
.seg label:has(input:focus-visible){outline:3px solid var(--buis)}
.seg label:has(input:disabled){cursor:not-allowed;opacity:.6}
.tiles{display:grid;gap:8px}
.tile{display:flex;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;align-items:flex-start;background:var(--surface)}
.tile:has(input:checked){border-color:var(--platane);background:var(--platane-soft)}
.tile:has(input:focus-visible){outline:3px solid var(--buis)}
.tile input{margin-top:4px;accent-color:var(--platane)}
.tile b{display:block;font-size:16px}
.tile small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch span small{display:block;color:var(--muted);font-size:13px}
.switch input,.mini-switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:10px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after,.mini-switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked,.mini-switch input:checked{background:var(--platane)}
.switch input:checked::after,.mini-switch input:checked::after{transform:translateX(18px)}
.switch input:disabled{opacity:.5;cursor:not-allowed}
.mini-switch{display:flex;align-items:center}
fieldset{border:0;padding:0;margin:0 0 6px;min-width:0}
legend{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:20px;padding:0;margin:18px 0 8px}

/* Équipes */
.addform{margin-top:6px}
.teamlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.teamrow{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.teamrow.absent{opacity:.55}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.clubpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 14px}
.clubpick .flabel{margin-right:2px}
.chip.pick{cursor:pointer;font-size:13px;padding:5px 11px}
.chip.pick:hover{border-color:var(--platane);color:var(--ink)}
.chip.pick.on{background:var(--platane);color:var(--platane-ink);border-color:var(--platane)}

/* Lignes équipe */
.tl{display:flex;align-items:center;gap:9px;min-width:0}
.tl-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tl-txt b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-txt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbd .tl-txt b{color:var(--muted);font-weight:500}

/* Parties */
.mlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:grid;gap:6px;text-align:left;min-width:0}
.match.tap{cursor:pointer}
.match.tap:hover{border-color:var(--platane)}
.match.done{background:var(--surface-2)}
.m-warn{font-size:12.5px;font-weight:700;color:var(--bad)}
table.rr{min-width:0;width:auto}
.rr th,.rr td{text-align:center;padding:7px 9px;font-variant-numeric:tabular-nums;font-size:14px}
.rr td.l,.rr th.l{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.rr-t{display:inline-flex;align-items:center;gap:8px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.rr-w{background:var(--ok-soft);color:var(--ok);font-weight:700}
.rr-l{color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.step{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:650;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.step .ic{width:14px;height:14px}
.step.done{background:var(--platane-soft);color:var(--platane-text);border-color:transparent}
.step.cur{background:var(--platane);color:var(--platane-ink);border-color:var(--platane)}
.step.next{background:var(--buis-soft);color:var(--buis-text);border-color:var(--buis)}
.ptsbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 14px}
.ptsbar .seg{min-width:220px}
.ptsbar small{flex-basis:100%;font-size:13px}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--platane-text)}
.sim{border-style:dashed;border-width:1.5px;margin:12px 0 4px;box-shadow:none}
.rr-x{background:var(--surface-2)}
.rr-n{color:var(--muted)}
.rr-p{color:var(--buis-text);font-size:12px!important}
.m-ctx{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-body{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;min-width:0}
.m-sides{display:grid;gap:5px;min-width:0}
.m-side{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.m-side .sc{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:25px;line-height:1;min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.m-side.win .tl-txt b{font-weight:750}
.m-side.lose{opacity:.55}
.terrain{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--gravier);color:var(--gravier-ink);font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:21px;
  background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.3px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.3px);background-size:6px 6px,7px 7px;background-position:0 0,3px 2px}
.terrain.none{background:var(--surface-2);background-image:none;color:var(--muted);font-family:'Barlow',ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600;text-align:center;line-height:1.1;border:1px dashed var(--line)}
.terrain.fin{background:transparent;background-image:none;color:var(--ok);border:0}
.terrain.blank{background:transparent;background-image:none}

/* Prochaine étape */

.chip.bad{background:var(--bad-soft);color:var(--bad)}
</style>
<style>
.sb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.sb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.sb-tx{flex:1 1 240px;line-height:1.35}
.sb-act{display:flex;gap:8px;flex-wrap:wrap}
.sb-act .btn{min-height:34px;padding:0 12px;font-size:13.5px}
.sb-ok{background:var(--ok-soft)}.sb-ok .sb-dot{background:var(--ok)}
.sb-warn{background:var(--buis-soft)}.sb-warn .sb-dot{background:var(--buis)}
.sb-alert{background:var(--bad-soft);font-weight:600}.sb-alert .sb-dot{background:var(--bad)}
.sb-neutre{background:var(--surface-2)}
</style>
<style>
/* ===== P-Tanq Local : verrouillage, sauvegardes, installation ===== */
.lock-ov{position:fixed;inset:0;z-index:30000;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.lock-card{width:100%;max-width:360px;text-align:center}
.lock-brand{display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:40px;line-height:1;color:var(--platane-text);margin-bottom:10px}
.lock-h{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:800;font-size:26px;letter-spacing:.02em;margin:6px 0 4px}
.lock-dots{display:flex;justify-content:center;gap:14px;margin:18px 0 6px}
.lock-dots i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--platane-text)}
.lock-dots i.on{background:var(--platane-text)}
.lock-err{color:var(--bad);font-weight:600;min-height:1.5em;margin:6px 0}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lock-pad .key{min-height:64px;font-size:30px}
.lock-pad .key:disabled{opacity:.4}
.lock-ov.shake .lock-dots{animation:lk-shk .4s}
@keyframes lk-shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.lock-ov.shake .lock-dots{animation:none}}
.rescue{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--surface-2);border:2px dashed var(--buis);border-radius:12px;padding:16px;margin:12px 0;color:var(--ink);-webkit-user-select:all;user-select:all}
.bk-sec{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.bk-sec .fi-h{margin-top:0}
.inst{margin:4px 0 12px;padding-left:22px;line-height:1.5}
.inst li{margin:5px 0}
.ptp-pack{background:var(--platane-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
#lbars .sb{border-bottom:1px solid var(--line)}
.top .brand .mark{flex:none}
.ver.lv{text-align:center}
</style>

<style>
/* ===== P-Tanq Local : Agenda, Classement, Saison ===== */
.subtabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 14px}
.subtabs .btn[aria-pressed="true"]{background:var(--platane);color:#fff;border-color:var(--platane)}
.sw-row{display:flex;align-items:flex-start;gap:10px;cursor:pointer;line-height:1.4}
.sw-row input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--platane)}
.sw-row.sm{align-items:center;font-size:14px;font-weight:600;color:var(--muted)}
.ag-m{margin:22px 0 10px;text-transform:capitalize}
.ag-list{display:grid;gap:10px}
.ag-card{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ag-card.ag-off{opacity:.6}
.ag-date{text-align:center;background:var(--platane-soft);border-radius:10px;padding:6px 0}
.ag-date b{display:block;font-family:'Bebas Neue','Arial Narrow',sans-serif;font-size:30px;line-height:1;color:var(--platane-text)}
.ag-date small{font-size:12px;color:var(--muted);text-transform:capitalize}
.ag-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.ag-body .chip{align-self:flex-start;margin-top:4px}
.ag-id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.ag-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:330px}
.ag-next{margin:16px 0}
.chip.warn{background:var(--buis-soft,#f6e3c9);color:var(--buis-ink,#7a3f10)}
tr.tap{cursor:pointer}
tr.tap:hover td{background:var(--surface-2)}
.muted{color:var(--muted)}
.ligue-f select{border:0!important;min-height:40px;padding:6px 8px;background-color:transparent;box-shadow:none!important;flex:1;min-width:0}
.fi-row.fi-miss dd{color:var(--muted)}
@media (max-width:700px){.ag-card{grid-template-columns:52px 1fr}.ag-acts{grid-column:1/-1;justify-content:flex-start;max-width:none}}
</style>

</head>

function simStrength(id){let h=7;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return 0.5+(h%1000)/1000;}

  const m=x.m,p=x.points,a=simStrength(m.a),b=simStrength(m.b),aWins=Math.random()<a/(a+b);

}
function simPending(t){

    applyWithdrawals(t);const X=allMatches(t).filter(x=>isPlayable(x.m));if(!X.length)break;
    X.forEach(x=>{const [sa,sb]=simScore(x);x.m.sa=sa;x.m.sb=sb;x.m.done=true;x.m.dt=Date.now()+k;x.m.sim=true;if(x.kind==='pool')refreshPool(x.p);k++;});

}
function simCard(t){
  if(!t.demo||!t.started||finished(t))return '';

  const toPools=((t.format==='suisse'&&smode(t)==='poules')||t.format==='poules')&&!F,toEnd=!toPools;
  return `<section class="card sim"><h2 class="h3">Mode essai</h2><p class="note" style="margin:0 0 10px">Scores tirés au hasard, en tenant compte d’un niveau propre à chaque équipe. Les tirages, eux, sont réels.</p><div class="row gap">${pending?`<button class="btn sm" data-act="simNow">Simuler les parties en cours</button>`:''}${toPools?`<button class="btn sm primary" data-act="simPools">Simuler jusqu’à la sortie des poules</button>`:''}${toEnd?`<button class="btn sm primary" data-act="simEnd">Simuler jusqu’à la fin</button>`:''}</div></section>`;
}

/* ============ Parties ============ */
function mkM(a,b){return{id:'m'+rid(),a:a||null,b:b||null,sa:null,sb:null,done:false,terrain:null,ts:Date.now()};}
function mkBye(a,sa,sb){const m=mkM(a,null);m.bye=true;m.done=true;m.sa=sa??null;m.sb=sb??null;m.dt=Date.now();return m;}
const winnerOf=m=>!m.done?null:(m.bye?m.a:(m.sa>m.sb?m.a:m.b));
const loserOf=m=>(!m.done||m.bye)?null:(m.sa>m.sb?m.b:m.a);
const roundDone=r=>r&&r.matches.every(m=>m.done);

function roundLabel(n){if(n<=2)return 'Finale';if(n<=4)return 'Demi-finales';if(n<=8)return 'Quarts de finale';if(n<=16)return '1/8 de finale';if(n<=32)return '1/16 de finale';if(n<=64)return '1/32 de finale';return null;}
function pointsFor(t,b,n){const s=t.settings;let p=b.final?+s.finalPoints:+s.points;if(s.quarter13&&n<=8&&b.kind!=='split')p=13;return p;}

/* Tirage au sort en évitant si possible deux équipes du même club */
function drawPairs(t,list){
  const avoid=t.settings.avoidClub;
  if(!avoid)return chunk(shuffle(list));
  const club=id=>clubKey(t,id);
  let best=null,bestC=Infinity;
  for(let k=0;k<150;k++){
    const a=shuffle(list);
    for(let i=0;i<a.length-1;i+=2){const c=club(a[i]);if(c&&c===club(a[i+1])){for(let j=i+2;j<a.length;j++){if(club(a[j])!==c){[a[i+1],a[j]]=[a[j],a[i+1]];break;}}}}
    let conf=0;for(let i=0;i<a.length-1;i+=2){const c=club(a[i]);if(c&&c===club(a[i+1]))conf++;}
    if(conf<bestC){bestC=conf;best=a;if(!conf)break;}
  }
  return chunk(best);
}
/* Règle : pas de rencontre entre équipes d’un même club avant les 1/8 de finale */
const sameClub=(t,a,b)=>{const c=clubKey(t,a);return !!c&&c===clubKey(t,b);};
function clubStrict(t,n,prelim){return !!t.settings.avoidClub&&(prelim||n>16);}
function clubCounts(t,ids){const c={};ids.forEach(id=>{const x=team(t,id);const k=(x&&x.club||'').trim();if(!k)return;const key=k.toLowerCase();(c[key]=c[key]||[k,0])[1]++;});return Object.values(c).sort((a,b)=>b[1]-a[1]);}
function clubFeasible(t,list){const cc=clubCounts(t,list);return !cc.length||cc[0][1]<=list.length/2;}
function matchAvoid(list,bad,maxSteps){
  maxSteps=maxSteps||200000;const ids=shuffle(list),used=new Set(),res=[];let steps=0;
  function rec(){
    if(used.size===ids.length)return true;
    let best=null,opts=null;
    for(const x of ids){if(used.has(x))continue;const o=ids.filter(y=>y!==x&&!used.has(y)&&!bad(x,y));if(!best||o.length<opts.length){best=x;opts=o;if(o.length<=1)break;}}
    if(!opts.length)return false;
    used.add(best);
    for(const y of opts){if(++steps>maxSteps)break;used.add(y);res.push([best,y]);if(rec())return true;res.pop();used.delete(y);}
    used.delete(best);return false;
  }
  return rec()?res:null;
}
function repairPairs(pairs,bad){
  const p=pairs.map(x=>x.slice()),ok=(a,b)=>!a||!b||!bad(a,b);
  for(let i=0;i<p.length;i++){
    if(ok(p[i][0],p[i][1]))continue;
    const order=p.map((_,j)=>j).filter(j=>j!==i).sort((x,y)=>Math.abs(x-i)-Math.abs(y-i));
    let fixed=false;
    for(const j of order){if(!p[j][1]||!p[i][1])continue;if(ok(p[i][0],p[j][1])&&ok(p[j][0],p[i][1])){[p[i][1],p[j][1]]=[p[j][1],p[i][1]];fixed=true;break;}}
    if(!fixed)for(const j of order){if(!p[j][1]||!p[i][1])continue;if(ok(p[i][0],p[j][0])&&ok(p[i][1],p[j][1])){const a=p[j][0];p[j][0]=p[i][1];p[i][1]=a;fixed=true;break;}}
    if(!fixed)return null;
  }
  return p;
}
function pairWithExempt(list,cands,pairFn){
  if(list.length%2===0)return{pairs:pairFn(list),exempt:null};
  for(const ex of cands){const pr=pairFn(list.filter(x=>x!==ex));if(pr)return{pairs:pr,exempt:ex};}
  return{pairs:null,exempt:cands[0]||null};
}
function makePairs(t,b,ids,mode){
  const strict=clubStrict(t,ids.length,b.kind==='split'),bad=(a,c)=>sameClub(t,a,c);
  const cands=[...shuffle(ids.filter(x=>!b.exempted.includes(x)&&!isWd(t,x))),...shuffle(ids.filter(x=>b.exempted.includes(x)&&!isWd(t,x))),...ids.filter(x=>isWd(t,x))];
  const pairFn=rest=>{
    if(!strict)return mode==='ordre'?chunk(rest):drawPairs(t,rest);
    if(!clubFeasible(t,rest))return null;
    if(mode==='ordre'){const r=repairPairs(chunk(rest),bad);if(r)return r;}
    return matchAvoid(rest,bad);
  };
  let {pairs,exempt}=pairWithExempt(ids,cands,pairFn);
  if(!pairs){const rest=exempt?ids.filter(x=>x!==exempt):ids.slice();pairs=mode==='ordre'?chunk(rest):drawPairs(t,rest);}
  if(exempt){b.exempted.push(exempt);pairs.push([exempt,null]);}
  return pairs;
}
function clubWarn(t,fmt,k){
  if(!t.settings.avoidClub)return '';const ids=present(t).map(x=>x.id),cc=clubCounts(t,ids);if(!cc.length)return '';const name=esc(cc[0][0]),c=cc[0][1];
  if(fmt==='elim'&&c>ids.length/2)return `Le club ${name} représente ${c} équipes sur ${ids.length} : certaines rencontres entre ses équipes seront inévitables en 1ʳᵉ partie.`;
  if(fmt==='poules'&&c>k)return `Le club ${name} a ${c} équipes pour ${k} poules : deux de ses équipes partageront forcément une poule.`;
  if(fmt==='suisse'&&c>k)return `Le club ${name} a ${c} équipes pour ${k} poules : deux de ses équipes partageront une poule et devront s’y rencontrer, le plus tard possible.`;
  return '';
}
function fixCross(t,pairs){
  if(!clubStrict(t,pairs.length*2,false))return pairs;
  const pool={},rank={};(t.pools||[]).forEach(p=>{const r=poolResult(p);[r.q1,r.q2].forEach((id,i)=>{if(id){pool[id]=p.name;rank[id]=i+1;}});});
  const norm=pairs.map(([a,b])=>rank[a]===2?[b,a]:[a,b]);
  return repairPairs(norm,(a,b)=>sameClub(t,a,b)||pool[a]===pool[b])||pairs;
}
function fixSeeded(t,pairs,n,grp){
  const g=(a,b)=>!!grp&&grp[a]===grp[b],c=(a,b)=>!!t.settings.avoidClub&&sameClub(t,a,b);
  const both=repairPairs(pairs,(a,b)=>g(a,b)||c(a,b));if(both)return both;
  return grp?(repairPairs(pairs,g)||pairs):pairs;

/* Système suisse : nombre de poules = puissance de 2 (tableau final sans exempte), poules de 4 à 8 */
function swissPlanG(n,G){const base=Math.floor(n/G),extra=n%G;const sizes=Array.from({length:G},(_,i)=>base+(i<extra?1:0));return{G,sizes,rounds:Math.max(...sizes.map(k=>k%2?k:k-1)),qual:2*G};}

function swissPlan(t,n){
  const opts=swissOptions(n);if(!opts.length)return null;
  let G=+t.settings.swissGroups;
  if(!opts.includes(G))G=opts.slice().sort((a,b)=>Math.abs(n/a-6)-Math.abs(n/b-6)||a-b)[0];
  return{...swissPlanG(n,G),opts};
}
function swissTotal(t){const _m=smode(t);if(_m==='classique')return +t.settings.rounds||5;if(_m==='championnat'||_m==='complet'){const n=t.groups&&t.groups[0]?t.groups[0].teams.length:present(t).length;return _m==='championnat'?(n%2?n:n-1):Math.max(1,Math.ceil(Math.log2(Math.max(2,n))));}if(t.groups&&t.groups.length)return Math.max(...t.groups.map(g=>g.teams.length%2?g.teams.length:g.teams.length-1));const p=swissPlan(t,present(t).length);return p?p.rounds:0;}
const sizesTxt=s=>{const a=Math.min(...s),b=Math.max(...s);return a===b?`${a}`:`${a} ou ${b}`;};
function swissGroupField(t){
  if(t.started&&t.groups){const G=t.groups.length;return `<div class="field"><span class="flabel">Poules</span><p class="note" style="margin:4px 0 0">${plural(G,'poule','poules')}, ${swissTotal(t)} rondes, ${2*G} qualifiées.</p></div>`;}
  const n=capOf(t)||present(t).length,pl=swissPlan(t,n);
  if(!pl)return `<div class="field"><span class="flabel">Poules</span><p class="note" style="margin:4px 0 0">Il faut au moins 4 équipes présentes.</p></div>`;
  return `<div class="field"><label for="s-gs">Nombre de poules (${n} équipes)</label><select id="s-gs" name="swissGroups">${pl.opts.map(G=>{const p=swissPlanG(n,G);return `<option value="${G}" ${G===pl.G?'selected':''}>${plural(G,'poule','poules')} de ${sizesTxt(p.sizes)}, ${p.rounds} rondes, ${p.qual} qualifiées</option>`;}).join('')}</select></div>`;
}
function rrGrid(t,g){
  if(!g.rounds.length)return '';
  const ids=swissStats(t,g).map(x=>x.id),res={};
  g.rounds.forEach(r=>r.matches.forEach(m=>{if(!m.b)return;res[m.a+'|'+m.b]=m;res[m.b+'|'+m.a]=m;}));
  const cell=(a,b)=>{if(a===b)return '<td class="rr-x" aria-hidden="true"></td>';const m=res[a+'|'+b];if(!m)return '<td class="rr-n">·</td>';if(!m.done)return '<td class="rr-p">à jouer</td>';const mine=m.a===a?m.sa:m.sb,their=m.a===a?m.sb:m.sa;return `<td class="${mine>their?'rr-w':'rr-l'}">${mine}–${their}</td>`;};
  const played=Object.values(res).filter(m=>m.done).length/2,total=ids.length*(ids.length-1)/2;
  return `<details open><summary>Grille de la poule ${g.name} : ${played} rencontres jouées sur ${total}</summary><div class="tablewrap"><table class="rr"><thead><tr><th class="l">Équipe</th>${ids.map(id=>`<th>${team(t,id).n}</th>`).join('')}</tr></thead><tbody>${ids.map(a=>`<tr><td class="l"><span class="rr-t"><span class="boule sm">${team(t,a).n}</span>${esc(team(t,a).chef)}</span></td>${ids.map(b=>cell(a,b)).join('')}</tr>`).join('')}</tbody></table></div></details>`;

function drawMsg(t,msg){
  const n=allMatches(t).filter(x=>x.clash&&!x.m.done).length;
  const pc=t.pools&&!t.partiesDrawn?groupClash(t,t.pools.map(p=>p.teams)):0;
  toast(n?`${msg}. Attention : ${plural(n,'rencontre','rencontres')} entre équipes d’un même club impossible${n>1?'s':''} à éviter.`:(pc?`${msg}. Attention : faute de poules assez nombreuses, des équipes d’un même club partagent une poule.`:msg));
}

/* ============ Tableaux à élimination ============ */
function newBracket(t,o){
  const b={id:o.id,name:o.name,kind:o.kind||'ko',teams:o.teams.slice(),rounds:[],loserTo:o.loserTo||null,final:!!o.final,offset:o.offset||1,exempted:[]};
  t.brackets.push(b);
  if(b.teams.length>=2)addRound(t,b,b.teams,o.firstPairs||null);
  return b;
}
function addRound(t,b,ids,pairs){
  const n=ids.length;
  if(!pairs)pairs=makePairs(t,b,ids,b.rounds.length===0?'tirage':(b.final?t.settings.finalDraw:t.settings.drawMode));
  const label=b.kind==='split'?'Tirage général':(roundLabel(n)||`${b.rounds.length+b.offset}ᵉ partie`);
  b.rounds.push({label,points:pointsFor(t,b,n),n,matches:pairs.map(([a,c])=>c==null?mkBye(a):mkM(a,c))});
  assignTerrains(t);
}
function bracketWinner(b){
  if(!b||b.kind==='split')return null;
  if(b.teams.length<2)return b.teams[0]||null;
  const r=b.rounds[b.rounds.length-1];if(!roundDone(r))return null;
  const w=r.matches.map(winnerOf);return w.length===1?w[0]:null;
}
function needsAdvance(t,b){
  const r=b.rounds[b.rounds.length-1];if(!r||!roundDone(r))return false;
  if(b.kind==='split')return !getB(t,'A');
  if(r.matches.length>1)return true;
  return b.rounds.length===1&&!!b.loserTo&&!getB(t,b.loserTo);
}
function advance(t,b){
  const r=b.rounds[b.rounds.length-1];if(!roundDone(r))return;
  const winners=r.matches.map(winnerOf),losers=r.matches.map(loserOf).filter(Boolean);
  if(b.kind==='split'){
    if(getB(t,'A'))return;
    newBracket(t,{id:'A',name:'Concours A',teams:winners,loserTo:t.settings.concoursC?'C':null,offset:2});
    newBracket(t,{id:'B',name:'Concours B',teams:losers,loserTo:t.settings.concoursD?'D':null,offset:2});
    return;
  }
  if(b.rounds.length===1&&b.loserTo&&!getB(t,b.loserTo)){
    newBracket(t,{id:b.loserTo,name:b.loserTo==='C'?'Concours C':'Concours D',teams:losers,offset:3});
  }
  if(winners.length>1)addRound(t,b,winners);
}
function bracketDesc(b){
  if(b.id==='A')return 'Principal : gagnants de la 1ʳᵉ partie.';
  if(b.id==='B')return 'Complémentaire : perdants de la 1ʳᵉ partie.';
  if(b.id==='C')return 'Secondaire : perdants de la 2ᵉ partie du concours A.';
  if(b.id==='D')return 'Secondaire : perdants de la 2ᵉ partie du concours B.';
  if(b.id==='P1')return 'Tirage général : gagnants au concours A, perdants au concours B.';
  return '';
}

/* ============ Poules ============ */
function poolSizes(n){const P=Math.ceil(n/4),th=4*P-n;if(n<3||th>P)return null;return Array.from({length:P},(_,i)=>i<P-th?4:3);}
const isPow2=x=>x>0&&(x&(x-1))===0;
const powDown=x=>{let p=1;while(p*2<=x)p*=2;return p;};
const powUp=x=>{let p=1;while(p<x)p*=2;return p;};
function poolSizesP(n,P){if(P<1||3*P>n||4*P<n)return null;const f=n-3*P;return Array.from({length:P},(_,i)=>i<f?4:3);}
function poolCountOptions(n){const o=[];for(let P=Math.ceil(n/4);P<=Math.floor(n/3)&&P<=128;P++)if(P>=1)o.push(P);return o;}
/* Qualification : Q = 2P si c’est une puissance de 2 ; sinon repêchage des meilleurs 3ᵉˢ (Q↑),
   sélection des meilleurs 2ᵉˢ (Q↓) ou cadrage (2 par poule, exemptes au 1er tour) */
function qualModes(P){
  const q=2*P,out=[];
  if(isPow2(q))return [{mode:'exact',Q:q,byes:0,label:`2 qualifiées par poule, soit ${q} : tableau complet, sans exempte`}];
  const up=powUp(q),dn=powDown(q);
  if(up-q<=P)out.push({mode:'repechage',Q:up,byes:0,label:`${q} qualifiées + ${up-q} ${up-q>1?'meilleures 3ᵉˢ repêchées':'meilleure 3ᵉ repêchée'} = ${up}, sans exempte`});
  if(dn>=P&&dn<q)out.push({mode:'meilleurs2',Q:dn,byes:0,label:`les ${P} premières + ${dn-P} ${dn-P>1?'meilleures 2ᵉˢ':'meilleure 2ᵉ'} = ${dn}, sans exempte`});
  out.push({mode:'cadrage',Q:q,byes:powUp(q)-q,label:`2 qualifiées par poule, soit ${q}, avec partie de cadrage (${powUp(q)-q} exemptes au 1ᵉʳ tour)`});
  return out;
}
function poolPlan(t,n){
  const opts=poolCountOptions(n);if(!opts.length)return null;
  let P=+t.settings.poolCount;
  if(!opts.includes(P)){const p2=opts.filter(x=>isPow2(2*x));P=p2.length?p2[p2.length-1]:opts[0];}
  const modes=qualModes(P);let qm=modes.find(m=>m.mode===t.settings.qualMode);
  if(!qm){const z=modes.filter(m=>!m.byes);qm=z.length?z.sort((a,b)=>Math.abs(a.Q-2*P)-Math.abs(b.Q-2*P)||b.Q-a.Q)[0]:modes[0];}
  return{P,sizes:poolSizesP(n,P),opts,modes,qm};
}
function planFromPools(t){const P=(t.pools||[]).length;const modes=qualModes(P);let qm=modes.find(m=>m.mode===t.settings.qualMode);if(!qm){const z=modes.filter(m=>!m.byes);qm=z.length?z.sort((a,b)=>Math.abs(a.Q-2*P)-Math.abs(b.Q-2*P)||b.Q-a.Q)[0]:modes[0];}return{P,modes,qm};}
function poolTeamStats(p){const S={};(p.teams||[]).forEach(id=>S[id]={id,w:0,pf:0,pa:0});if(p.m)Object.values(p.m).forEach(m=>{if(!m||!m.done||m.bye||!m.a||!m.b)return;const A=S[m.a],B=S[m.b];if(!A||!B)return;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;if(m.sa>m.sb)A.w++;else B.w++;});Object.values(S).forEach(x=>x.diff=x.pf-x.pa);return S;}
function rankQualified(t,qm){
  const F1=[],F2=[],F3=[],grp={};const cmp=(a,b)=>b.w-a.w||b.diff-a.diff||b.pf-a.pf||((team(t,a.id)||{}).n||0)-((team(t,b.id)||{}).n||0);
  t.pools.forEach(p=>{const r=poolResult(p),S=poolTeamStats(p);p.teams.forEach(id=>grp[id]=p.name);
    if(r.q1)F1.push({...S[r.q1],rk:1});if(r.q2)F2.push({...S[r.q2],rk:2});const L=p.m&&p.m.bar&&p.m.bar.done?loserOf(p.m.bar):null;if(L)F3.push({...S[L],rk:3});});
  F1.sort(cmp);F2.sort(cmp);F3.sort(cmp);
  let list;

  else if(qm.mode==='repechage')list=[...F1,...F2,...F3.slice(0,qm.Q-F1.length-F2.length)];
  else list=[...F1,...F2];
  return{ids:list.map(x=>x.id),grp,rk:Object.fromEntries(list.map(x=>[x.id,x.rk]))};
}
function poolCountField(t){
  if(t.format!=='poules')return '';
  if(t.started&&t.pools){const pl=planFromPools(t);return `<div class="field"><span class="flabel">Poules et qualification</span><p class="note" style="margin:4px 0 0">${plural(t.pools.length,'poule','poules')} : ${pl.qm.label}.</p></div>`;}
  const n=present(t).length,pl=poolPlan(t,n);
  if(!pl)return `<div class="field"><span class="flabel">Poules</span><p class="note" style="margin:4px 0 0">Il faut au moins 3 équipes présentes (et pas exactement 5).</p></div>`;
  return `<div class="field"><label for="s-pc">Nombre de poules (${n} équipes présentes)</label><select id="s-pc" name="poolCount">${pl.opts.map(P=>{const sz=poolSizesP(n,P),f=sz.filter(x=>x===4).length,th=P-f;return `<option value="${P}" ${P===pl.P?'selected':''}>${plural(P,'poule','poules')}${f?`, ${f} de 4`:''}${th?`, ${th} de 3`:''} : ${2*P} qualifiées${isPow2(2*P)?', sans exempte':''}</option>`;}).join('')}</select></div>

function swissStats(t,g){
  const S={};g.teams.forEach(id=>S[id]={id,w:0,l:0,pf:0,pa:0,opp:[],bye:0,res:{},j:0});
  g.rounds.forEach(r=>r.matches.forEach(m=>{
    if(!m.done)return;

    A.j++;B.j++;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;A.opp.push(m.b);B.opp.push(m.a);
    if(m.sa>m.sb){A.w++;B.l++;A.res[m.b]=1;B.res[m.a]=-1;}else{B.w++;A.l++;B.res[m.a]=1;A.res[m.b]=-1;}

}
/* Classement d’une poule : victoires, puis critères dans l’ordre choisi. La confrontation directe

function rankStats(t,arr){
  const keys=['w',...t.settings.tiebreaks];
  const val=(k,s,sub)=>{if(k==='cd'){let c=0;sub.forEach(o=>{if(o!==s&&s.res[o.id]===1)c++;});return c;}return s[k]||0;};
  const rec=(sub,i)=>{
    if(sub.length<=1||i>=keys.length)return sub.sort((x,y)=>((team(t,x.id)||{}).n||0)-((team(t,y.id)||{}).n||0));
    const k=keys[i],groups=new Map();
    sub.forEach(s=>{const v=val(k,s,sub);if(!groups.has(v))groups.set(v,[]);groups.get(v).push(s);});
    return [...groups.keys()].sort((a,b)=>b-a).flatMap(v=>rec(groups.get(v),i+1));
  };
  return rec(arr.slice(),0);
}
function cmpStats(t){
  const tb=t.settings.tiebreaks;
  return (x,y)=>{
    if(y.w!==x.w)return y.w-x.w;
    for(const k of tb){if(k==='cd'){const r=x.res&&x.res[y.id];if(r)return -r;continue;}const d=(y[k]||0)-(x[k]||0);if(d)return d;}
    return ((team(t,x.id)||{}).n||0)-((team(t,y.id)||{}).n||0);
  };
}
function pairNoRematch(list,played){
  const res=[],used=new Set();let steps=0;

    const i=list.findIndex(x=>!used.has(x));if(i<0)return true;
    used.add(list[i]);
    for(let j=i+1;j<list.length;j++){
      const y=list[j];if(used.has(y)||played(list[i],y))continue;
      if(++steps>40000)break;
      used.add(y);res.push([list[i],y]);
      if(rec())return true;

    }
    used.delete(list[i]);return false;
  }

/* Poule à rencontres croisées : chaque ronde suit l’ordre suisse (gagnant contre gagnant),

const RRBYE='__exempte__';
function swissPair(t,g,ri){
  {const _m=smode(t);if(_m==='classique')return swissPairLegacy(t,g,ri);if(_m==='championnat')return champPair(t,g,ri);if(_m==='complet')return completPair(t,g,ri);}
  const s=t.settings,teams=g.teams.slice(),nodes=teams.length%2?[...teams,RRBYE]:teams.slice(),m=nodes.length;
  if(m>8)return swissPairLegacy(t,g,ri);

  for(let i=0;i<m;i++)for(let j=i+1;j<m;j++){E[i][j]=E[j][i]=nb++;}
  const full=(1<<nb)-1;let played=0;
  g.rounds.forEach(r=>r.matches.forEach(mm=>{const a=idx.get(mm.a),b=idx.get(mm.b||RRBYE);if(a!=null&&b!=null&&a!==b)played|=(1<<E[a][b]);}));

  else{const st=swissStats(t,g);rank=new Map(st.map((x,i)=>[x.id,i]));wins=new Map(st.map(x=>[x.id,x.w]));}

function teamStatus(t,id,X){

    if(!t.started){const pl=meleeSizes(n,sz);acts.push({act:'start',label:'Lancer la mêlée',btn:'Tirer la 1ʳᵉ partie',disabled:!pl,desc:pl?`${n} joueurs présents, ${R} parties. Partie 1 : ${pl.n3?plural(pl.n3,'triplette','triplettes'):''}${pl.n3&&pl.n2?' et ':''}${pl.n2?plural(pl.n2,'doublette','doublettes'):''}${pl.exempt?`, ${plural(pl.exempt,'joueur exempt','joueurs exempts')}`:''}, tirées au sort en évitant de reformer les mêmes partenaires.`:'',warn:pl?'':'Pointez au moins 4 joueurs présents.'});return acts;}

    if(k<R&&!meleeComplete(t)&&k>0){const c=t.mrounds[k-1].matches.filter(m=>!m.bye),d=c.filter(m=>m.done).length;acts.push({act:'nextMelee',label:`Tirer la partie ${k+1}`,btn:'Tirer la partie',disabled:true,desc:`Possible dès que tous les scores de la partie ${k} sont saisis : ${d} sur ${c.length} pour l’instant.`});}
    else if(k<R)acts.push({act:'nextMelee',label:`Tirer la partie ${k+1} sur ${R}`,btn:'Tirer la partie',desc:'Nouvelles équipes tirées au sort parmi les joueurs, en évitant les partenaires déjà associés.'});
    if(k&&meleeComplete(t))acts.push({act:'roundSheet',label:`Feuille de match de la partie ${k}`,btn:'Établir la feuille',secondary:true,desc:'Résultats de la partie et bilan de chaque joueur, à imprimer ou archiver.'});
    if(finished(t))acts.push({act:'openReport',label:'Rapport de concours',btn:'Établir le rapport',desc:'Classement individuel sur une page, à imprimer ou à exporter en PDF.'});
    if(!hasResults(t)&&k)acts.push({act:'cancelStart',label:'Annuler le tirage',secondary:true,desc:'Revenir aux inscriptions, tant qu’aucun score n’est saisi.'});
    return acts;
  }
  if(!t.started){
    if(t.format==='elim'){
      acts.push({act:'start',label:'Lancer le concours',btn:'Tirer la 1ʳᵉ partie',disabled:n<2,
        desc:n<2?'':`${n} équipes présentes. Gagnants de la 1ʳᵉ partie au concours A, perdants au concours B.${n%2?' Nombre impair : une équipe sera exempte.':''}`,
        warn:n<2?'Pointez au moins 2 équipes présentes.':clubWarn(t,'elim')});
    }else if(t.format==='poules'){
      const ppl=poolPlan(t,n),sz=ppl?ppl.sizes:null,over=sz?clubOver(t,sz.length):null;const c4=sz?sz.filter(x=>x===4).length:0,c3=sz?sz.length-c4:0;
      acts.push({act:'start',label:'Former les poules',btn:'Tirer les poules',disabled:!sz||!!over,
        desc:sz?`${n} équipes présentes : ${plural(sz.length,'poule','poules')}${c4?`, ${c4} de 4`:''}${c3?`, ${c3} de 3`:''}. Qualification : ${ppl.qm.label}.`:'',
        warn:sz?(over?overMsg(t,over):''):(n===5?'Avec 5 équipes, impossible de former des poules de 3 ou 4 : ajoutez ou retirez une équipe.':'Pointez au moins 3 équipes présentes.')});
    }else{
      if(smode(t)!=='poules'){acts.push(modeStartAction(t,n));return acts;}
      const cap=capOf(t),capBad=!!cap&&n!==cap,pl=swissPlan(t,cap||n),G=pl?pl.G:1,over=pl?clubOver(t,pl.G):null;
      acts.push({act:'start',label:'Former les poules',btn:'Tirer les poules',disabled:!pl||capBad||!!over,
        desc:pl?`${n} équipes présentes : ${plural(G,'poule','poules')} de ${sizesTxt(pl.sizes)} équipes. Chacune rencontre toutes les autres de sa poule (${pl.rounds} rondes de ${s.duration} minutes). ${pl.qual} qualifiées, phase finale sans exempte${pl.qual>2?` à partir des ${(roundLabel(pl.qual)||'').toLowerCase()}`:''}.`:'',
        warn:over?overMsg(t,over):capBad?capMsg(t,n):!pl?(n<4?'Pointez au moins 4 équipes présentes.':'Au-delà de 512 équipes (64 poules de 8), le système suisse n’est pas disponible : choisissez les poules ou l’élimination directe.'):clubWarn(t,'suisse',G)});
    }
    return acts;
  }
  if(t.format==='poules'){
    const F=getB(t,'F');
    if(!t.partiesDrawn){
      acts.push({act:'drawParties',label:'Tirer les parties',desc:'Dans chaque poule, tirage des rencontres de la 1ʳᵉ partie. Les terrains sont attribués automatiquement.'});
      acts.push({act:'redrawPools',label:'Refaire le tirage des poules',secondary:true,desc:'Possible tant que les parties ne sont pas tirées.'});
    }else if(!F&&t.pools.every(p=>poolResult(p).done)){
      const pq=planFromPools(t).qm;
      acts.push({act:'startFinal',label:'Lancer la phase finale',desc:pq.mode==='exact'?`${pq.Q} équipes qualifiées, croisement des poules (1ʳᵉ de A contre 2ᵉ de D, 2ᵉ de A contre 1ʳᵉ de D…), sans exempte.`:`Qualification : ${pq.label}. Placement selon le classement, sans rencontre entre équipes d’une même poule au premier tour.`});
    }
  }
  if(t.format==='suisse'){
    const F=getB(t,'F');
    if(t.swissRound===0){
      acts.push({act:'nextRonde',label:'Lancer la ronde 1',desc:`Tirage au sort des rencontres dans chaque poule. Chronomètre réglé sur ${s.duration} minutes.`});
      acts.push({act:'redrawPools',label:'Refaire le tirage des poules',secondary:true});
    }else if(!swissRoundComplete(t)&&!F){
      const c=rondeCount(t,t.swissRound-1),last=t.swissRound>=swissTotal(t);
      acts.push({act:last?'startFinal':'nextRonde',label:last?(finalQ(t)?'Lancer la phase finale':'Classement final'):`Lancer la ronde ${t.swissRound+1}`,btn:last?(finalQ(t)?'Lancer la phase finale':'Classement final'):'Tirer la ronde',disabled:true,
        desc:`Possible dès que tous les scores de la ronde ${t.swissRound} sont saisis : ${c.d} sur ${c.a} pour l’instant.`});
    }else if(swissRoundComplete(t)){
      acts.push({act:'roundSheet',label:`Feuille de match de la ronde ${t.swissRound}`,btn:'Établir la feuille',secondary:true,desc:'Résultats de la ronde et bilan de chaque équipe (gains, pertes, Buchholz, Buchholz avancé), à imprimer ou archiver.'});
      if(t.swissRound<swissTotal(t))acts.push({act:'nextRonde',label:`Lancer la ronde ${t.swissRound+1} sur ${swissTotal(t)}`,desc:'Gagnant contre gagnant selon le classement, sans revanche, en garantissant que chaque équipe rencontrera toutes les autres de sa poule.'});
      else if(!F&&finalQ(t)){const total=finalQ(t);
        acts.push({act:'startFinal',label:'Lancer la phase finale',desc:`${total} équipes qualifiées${smode(t)==='poules'?' (2 par poule)':' (selon le classement)'}, sans exempte : ${(roundLabel(total)||'tableau').toLowerCase()} en ${s.quarter13&&total<=8?13:s.finalPoints} points. Deux qualifiées d’une même poule ne se retrouvent pas au premier tour.`});}
    }
  }
  (t.brackets||[]).forEach(b=>{
    if(!needsAdvance(t,b))return;
    const r=b.rounds[b.rounds.length-1],w=r.matches.length;
    if(b.kind==='split'){
      const l=r.matches.filter(m=>!m.bye).length;
      acts.push({act:'advance',bid:b.id,label:'Former les concours A et B',btn:'Tirer la 2ᵉ partie',desc:`${w} équipes au concours A, ${l} au concours B. Tirage au sort de la 2ᵉ partie dans chacun.`});
    }else{
      const mode=b.final?t.settings.finalDraw:t.settings.drawMode;
      const extra=b.rounds.length===1&&b.loserTo&&!getB(t,b.loserTo)?` Les perdants de ce tour forment le concours ${b.loserTo}.`:'';
      acts.push({act:'advance',bid:b.id,label:`${b.name} : tour suivant`,btn:mode==='ordre'?'Passer au tour suivant':'Effectuer le tirage',desc:w>1?`${w} équipes qualifiées pour ${(roundLabel(w)||'le tour suivant').toLowerCase()}.${extra}`:extra.trim()});
    }
  });
  if(finished(t))acts.push({act:'openReport',label:'Rapport de concours',btn:'Établir le rapport',desc:'Rapport d’une page avec les résultats et les points attribués, à imprimer ou à exporter en PDF pour archivage.'});
  if(!hasResults(t)&&(t.format==='elim'||t.partiesDrawn||t.swissRound>0||(t.mrounds&&t.mrounds.length)))acts.push({act:'cancelStart',label:'Annuler le tirage',secondary:true,desc:'Revenir aux inscriptions, tant qu’aucun score n’est saisi.'});
  return acts;
}

/* ============ Formules supplémentaires ============ */
const SMODES={poules:'Poules (tous contre tous dans la poule)',classique:'Système suisse classique',championnat:'Championnat (tous contre tous)',complet:'Élimination complète'};
const smode=t=>t&&t.format==='suisse'?(t.settings.swissMode||'poules'):'';
function fmtLabel(t){
  if(!t)return '';
  if(t.format==='melee')return `Mêlée tournante en ${+t.settings.meleeSize===2?'doublettes':'triplettes'}`;
  if(t.format==='suisse'&&smode(t)!=='poules')return SMODES[smode(t)];
  return FORMATS[t.format].label;
}
const typePl=t=>t.format==='melee'?'inscription individuelle':TYPES[t.type].plural;
function finalQ(t){if(t.format!=='suisse')return 0;const m=smode(t);if(m==='poules')return 2*((t.groups||[]).length||1);if(m==='complet')return 0;return +t.settings.finalQual||0;}
function natureOf(t){return t.format==='melee'?`${+t.settings.meleeSize===2?'Doublettes':'Triplettes'} tirées au sort à chaque partie`:NATURE[t.type];}

/* Championnat : calendrier par la méthode du tourniquet */
function rrSchedule(ids){
  const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,R=[];let arr=a.slice();
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const x=arr[i],y=arr[n-1-i];if(x===null)pairs.push([y,null]);else if(y===null)pairs.push([x,null]);else pairs.push(r%2?[y,x]:[x,y]);}R.push(pairs);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];}
  return R;
}
function champPair(t,g,ri){
  const s=t.settings;if(!g.schedule)g.schedule=rrSchedule(shuffle(g.teams));
  const P=g.schedule[ri]||[];const ms=P.filter(p=>p[1]).map(([a,b])=>mkM(a,b));
  P.filter(p=>!p[1]).forEach(p=>ms.push(mkBye(p[0],+s.byeA,+s.byeB)));return{matches:ms};
}
/* Élimination complète : à chaque ronde, les équipes au même parcours (victoires/défaites) se rencontrent */
function completPaths(t,g){const P={};g.teams.forEach(id=>P[id]='');g.rounds.forEach(r=>r.matches.forEach(m=>{if(!m.done)return;if(m.bye){P[m.a]+='W';return;}const w=winnerOf(m),l=loserOf(m);P[w]+='W';P[l]+='L';}));return P;}
function completPair(t,g,ri){
  const s=t.settings;
  if(ri===0){let list=g.teams.slice(),ex=null;if(list.length%2){ex=pick(list);list=list.filter(x=>x!==ex);}
    const pairs=t.settings.avoidClub?(matchAvoid(list,(a,b)=>sameClub(t,a,b),60000)||drawPairs(t,list)):drawPairs(t,list);
    g.order=[...pairs.flat(),...(ex?[ex]:[])];const ms=pairs.map(([a,b])=>mkM(a,b));if(ex)ms.push(mkBye(ex,+s.byeA,+s.byeB));return{matches:ms};}
  const P=completPaths(t,g),order=g.order||g.teams,groups=new Map();
  order.forEach(id=>{const k=P[id]||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(id);});
  const ms=[];[...groups.keys()].sort((a,b)=>b.localeCompare(a)).forEach(k=>{const l=groups.get(k);for(let i=0;i+1<l.length;i+=2)ms.push(mkM(l[i],l[i+1]));if(l.length%2)ms.push(mkBye(l[l.length-1],+s.byeA,+s.byeB));});
  return{matches:ms};
}
function groupRanking(t,g){
  const st=swissStats(t,g);if(smode(t)!=='complet')return st;
  const P=completPaths(t,g);st.forEach(x=>x.path=P[x.id]||'');
  return st.sort((a,b)=>b.path.localeCompare(a.path)||b.diff-a.diff||b.pf-a.pf||((team(t,a.id)||{}).n||0)-((team(t,b.id)||{}).n||0));
}
function modeStartAction(t,n){

  if(m==='championnat'){const R=n%2?n:n-1;desc=`${n} équipes : chacune rencontre toutes les autres, soit ${R} rondes${n%2?' (une équipe au repos à chaque ronde)':''}.${+s.finalQual?` Phase finale des ${s.finalQual} premières.`:''}`;}
  if(m==='complet'){const R=Math.max(1,Math.ceil(Math.log2(Math.max(2,n))));desc=`${n} équipes, ${R} rondes : toutes les équipes jouent chaque ronde, les gagnantes se disputent les premières places, les perdantes les suivantes.`;}
  return{act:'start',label:'Lancer le concours',btn:'Tirer la 1ʳᵉ ronde',disabled:!ok,desc:ok?desc:'',warn:ok?'':`Pointez au moins ${m==='championnat'?3:4} équipes présentes.`};
}
function swissModeFields(t){

function rankLabel(i){return i===0?'1ᵉʳ':`${i+1}ᵉ`;}
function rankingReport(t){
  const st=t.format==='melee'?meleeStats(t):(t.groups&&t.groups[0]?groupRanking(t,t.groups[0]):[]);

/* ============ Mêlée tournante (Super Mêlée) ============ */
function meleeSizes(N,target){
  for(let ex=0;ex<=3;ex++){const n=N-ex;if(n<4)continue;
    let T=target===3?Math.ceil(n/3):Math.floor(n/2);if(T%2)T+=target===3?1:-1;
    for(const c of [T,T-2,T+2,T-4,T+4])if(c>=2&&c%2===0&&2*c<=n&&n<=3*c){const n3=n-2*c;return{n3,n2:c-n3,exempt:ex};}}
  return null;
}
const meleeComplete=t=>!!(t.mrounds&&t.mrounds.length&&roundDone(t.mrounds[t.mrounds.length-1]));
const meleeFinished=t=>!!(t.started&&t.mrounds&&t.mrounds.length>=(+t.settings.rounds||4)&&meleeComplete(t));
function meleeStats(t){
  const ids=t.started?(t.mplayers||[]):present(t).map(x=>x.id),S={};
  ids.forEach(id=>S[id]={id,j:0,w:0,l:0,pf:0,pa:0,bye:0});
  const T=new Map((t.mrounds||[]).flatMap(r=>r.teams).map(x=>[x.id,x]));
  (t.mrounds||[]).forEach(r=>r.matches.forEach(m=>{if(!m.done)return;
    const A=(T.get(m.a)||{}).members||[],B=m.b?((T.get(m.b)||{}).members||[]):[];
    if(m.bye){A.forEach(p=>{const s=S[p];if(!s)return;s.j++;s.w++;s.bye++;s.pf+=m.sa||0;s.pa+=m.sb||0;});return;}
    const aw=m.sa>m.sb;
    A.forEach(p=>{const s=S[p];if(!s)return;s.j++;aw?s.w++:s.l++;s.pf+=m.sa;s.pa+=m.sb;});
    B.forEach(p=>{const s=S[p];if(!s)return;s.j++;aw?s.l++:s.w++;s.pf+=m.sb;s.pa+=m.sa;});}));
  const arr=Object.values(S);arr.forEach(s=>s.diff=s.pf-s.pa);
  return arr.sort((a,b)=>b.w-a.w||b.diff-a.diff||b.pf-a.pf||((team(t,a.id)||{}).n||0)-((team(t,b.id)||{}).n||0));
}
function meleeDraw(t){
  const s=t.settings,ids=(t.mplayers||[]).filter(p=>!isWd(t,p)),plan=meleeSizes(ids.length,+s.meleeSize===2?2:3);if(!plan)return null;
  const st=Object.fromEntries(meleeStats(t).map(x=>[x.id,x]));
  const ex=[];if(plan.exempt){const order=shuffle(ids).sort((a,b)=>(st[a]?st[a].bye:0)-(st[b]?st[b].bye:0));ex.push(...order.slice(0,plan.exempt));}
  const rest=ids.filter(x=>!ex.includes(x));
  const partners={};(t.mrounds||[]).forEach(r=>r.teams.forEach(x=>{const m=x.members;for(let i=0;i<m.length;i++)for(let j=i+1;j<m.length;j++){const k=[m[i],m[j]].sort().join('|');partners[k]=(partners[k]||0)+1;}}));
  const sizes=[...Array(plan.n3).fill(3),...Array(plan.n2).fill(2)];
  let best=null,bc=Infinity;
  for(let k=0;k<400;k++){const sh=shuffle(rest),teams=[];let p=0;shuffle(sizes).forEach(z=>{teams.push(sh.slice(p,p+z));p+=z;});
    let c=0;teams.forEach(m=>{for(let i=0;i<m.length;i++)for(let j=i+1;j<m.length;j++)c+=partners[[m[i],m[j]].sort().join('|')]||0;});
    if(c<bc){bc=c;best=teams;if(!c)break;}}
  const nm=id=>{const x=team(t,id);return x?x.chef:'?';};
  const mk=(members,i)=>({id:'x'+rid(),n:i+1,members,chef:nm(members[0]),players:members.slice(1).map(nm),club:members.length>1?members.slice(1).map(nm).join(', '):((team(t,members[0])||{}).club||'')});
  const t3=shuffle(best.filter(m=>m.length===3)),t2=shuffle(best.filter(m=>m.length===2)),pairs=[];
  while(t3.length>=2)pairs.push([t3.pop(),t3.pop()]);while(t2.length>=2)pairs.push([t2.pop(),t2.pop()]);if(t3.length&&t2.length)pairs.push([t3.pop(),t2.pop()]);
  const teams=[],matches=[];let n=0;
  shuffle(pairs).forEach(([a,b])=>{const A=mk(a,n++),B=mk(b,n++);teams.push(A,B);matches.push(mkM(A.id,B.id));});
  ex.forEach(id=>{const X=mk([id],n++);teams.push(X);matches.push(mkBye(X.id,+s.byeA,+s.byeB));});
  return{teams,matches,points:+s.points};
}
function meleeView(t,X){
  const s=t.settings;
  if(!t.started)return `${actionsCard(t)}<div class="empty"><b>La mêlée n’a pas commencé.</b><br>À chaque partie, les joueurs présents sont répartis au hasard en ${+s.meleeSize===2?'doublettes':'triplettes'}, complétées si besoin par quelques ${+s.meleeSize===2?'triplettes':'doublettes'}, en évitant de reformer les mêmes partenaires. Classement individuel : victoires, puis goal-average, puis points marqués.</div>`;

  <div class="tablewrap"><table><thead><tr><th>Rg</th><th class="l">Joueur</th><th>J</th><th>V</th><th>D</th><th title="Goal-average">Diff</th><th title="Points marqués">PM</th></tr></thead>
  <tbody>${st.map((x,i)=>`<tr class="${i<3&&x.j?'q':''}"><td class="rk">${i+1}</td><td class="l">${teamLine(t,x.id)}</td><td>${x.j}</td><td><b class="v">${x.w}</b></td><td>${x.l}</td><td>${x.diff>0?'+':''}${x.diff}</td><td>${x.pf}</td></tr>`).join('')}</tbody></table></div>
  ${(t.mrounds||[]).length?`<details><summary>Parties jouées, avec les équipes formées</summary>${t.mrounds.map((r,ri)=>`<span class="pm-l">Partie ${ri+1}</span><div class="mlist">${r.matches.map(m=>matchRow(t,XM.get(m.id))).join('')}</div>`).join('')}</details>`:''}`;

function meleeFields(t){

  return `<fieldset><legend>Mêlée tournante</legend>
    <div class="field"><span class="flabel">Équipes formées à chaque partie</span>${seg('meleeSize',+s.meleeSize===2?2:3,[[2,'Doublettes'],[3,'Triplettes']],t.started)}</div>
    <div class="grid2"><div class="field"><label for="s-mr">Nombre de parties</label><input id="s-mr" name="mRounds" type="number" min="${Math.max(1,(t.mrounds||[]).length)}" max="12" value="${s.rounds||4}"></div>
    <div class="field"><label for="s-md">Durée d’une partie au chronomètre (minutes)</label><input id="s-md" name="mDuration" type="number" min="5" max="240" value="${s.duration||45}"></div></div>
    ${sw('meleeTimed',s.meleeTimed,'Parties au chronomètre','Sinon, chaque partie se joue jusqu’au score prévu.')}
  </fieldset>`;

/* ============ Grand écran, feuilles de match, droits d’inscription ============ */
function bigSheet(t){
  const blocks=journeeOf(t).map(o=>{const X=allMatches(o).filter(x=>isPlayable(x.m)).sort((a,b)=>(a.m.terrain||9999)-(b.m.terrain||9999));
    const sub=X[0]?X[0].sub:(finished(o)?'Concours terminé':'En attente du tirage');
    return `<section class="bg-sec"><h2>${esc(o.name)}<small>${esc(sub)}</small></h2>${X.length?`<div class="bg-list">${X.map(x=>{const a=team(o,x.m.a),b=team(o,x.m.b);return `<div class="bg-row"><span class="bg-t">${x.m.terrain||'–'}</span><div class="bg-side"><b>${esc(a?a.chef:'')}</b><small>${esc(a?a.club||'':'')}</small></div><span class="bg-vs">contre</span><div class="bg-side"><b>${esc(b?b.chef:'')}</b><small>${esc(b?b.club||'':'')}</small></div></div>`;}).join('')}</div>`:'<p class="bg-empty">Aucune partie en cours.</p>'}</section>`;}).join('');
  const tm=t.timer,left=tm?chronoLeft(t):null;
  return `<div class="sheet bigscr" role="dialog" aria-modal="true" aria-labelledby="sh-t" tabindex="-1">
    <div class="bg-head"><div><h1 id="sh-t">${esc(t.jid&&t.jname?t.jname:t.name)}</h1><p>Le numéro à gauche est le terrain attribué.</p></div>${tm&&(tm.endAt||left<tm.dur)?`<span class="bg-chrono" data-chrono>${fmtTime(left)}</span>`:''}<div class="row gap"><button class="btn light" data-act="bigFull">Plein écran</button><button class="btn light" data-act="closeSheet">Fermer</button></div></div>
    ${blocks}</div>`;
}
function buildMatchSheets(t){
  const X=allMatches(t).filter(x=>isPlayable(x.m)).sort((a,b)=>(a.m.terrain||9999)-(b.m.terrain||9999));
  const d=pdfDoc(),W=595.28,H=841.89,cw=W/2,ch=H/2,BL='#184C59',MU='#6F6151',LN='#DED6C9',IN='#2A1C10';let P=null;
  const box=(x,y,w,h)=>{P.line(x,y,x+w,y,LN,0.8);P.line(x,y+h,x+w,y+h,LN,0.8);P.line(x,y,x,y+h,LN,0.8);P.line(x+w,y,x+w,y+h,LN,0.8);};
  X.forEach((x,i)=>{
    if(i%4===0){P=d.page();P.dline(cw,16,cw,H-16,LN,0.6);P.dline(16,ch,W-16,ch,LN,0.6);}
    const ox=(i%2)*cw,oy=H-Math.floor((i%4)/2)*ch,M=22,L=ox+M,R=ox+cw-M;let y=oy-M;
    P.rect(L,y-46,R-L,46,'#DCEBEE');

    P.text(L+10,y-34,x.sub,{size:9.5,color:MU,maxW:R-L-80});
    P.text(R-10,y-14,'Terrain',{size:8,color:MU,align:'right'});
    P.text(R-10,y-38,String(x.m.terrain||'—'),{size:24,bold:true,color:IN,align:'right'});
    y-=72;
    P.text(R-28,y+14,'Score',{size:8,color:MU,align:'center'});
    [x.m.a,x.m.b].forEach((id,k)=>{const tm=team(t,id)||{},sub=(tm.players||[]).filter(Boolean).join(', ');
      P.text(L,y,`${tm.n?'Équipe '+tm.n+' : ':''}${tm.chef||''}`,{size:12.5,bold:true,color:IN,maxW:R-L-70});
      P.text(L,y-15,t.format==='melee'?sub:[sub,tm.club].filter(Boolean).join(', '),{size:9.5,color:MU,maxW:R-L-70});
      box(R-56,y-22,56,34);
      if(k===0){P.text(L,y-38,'contre',{size:9.5,color:MU});y-=58;}
    });
    y-=50;
    P.text(L,y,'Score cumulé à chaque mène',{size:9,bold:true,color:MU});y-=10;
    const bw=(R-L-24)/13;
    ['A','B'].forEach((lab,k)=>{const yy=y-22-k*26;P.text(L,yy+7,lab,{size:10,bold:true,color:IN});for(let j=0;j<13;j++)box(L+24+j*bw,yy,bw-3,20);});
    y-=96;
    P.text(L,y,'Signature équipe A',{size:9,color:MU});P.text((L+R)/2+6,y,'Signature équipe B',{size:9,color:MU});
    P.line(L,y-30,(L+R)/2-10,y-30,LN,0.8);P.line((L+R)/2+6,y-30,R,y-30,LN,0.8);
    P.text(L,oy-ch+12,'P-tanq Carreau',{size:7.5,bold:true,color:BL});
  });
  return X.length?d.build(`Feuilles de match - ${t.name}`):null;
}

/* ============ Rendu ============ */
function teamLine(t,id,o={}){
  if(!id)return `<span class="tl tbd"><span class="boule sm ghost" aria-hidden="true"></span><span class="tl-txt"><b>À déterminer</b></span></span>`;
  const x=team(t,id);if(!x)return '';
  return `<span class="tl"><span class="boule ${o.size||'sm'}" aria-label="Équipe ${x.n}">${x.n}</span><span class="tl-txt"><b>${esc(x.chef)}</b><small>${esc(x.club||'Sans club')}${x.withdrawn?' <span class="wd-tag">absente</span>':''}</small></span></span>`;
}
function matchRow(t,x,o={}){
  if(!x)return '';
  const m=x.m,playable=isPlayable(m),editable=m.done&&!m.bye&&!x.locked,tap=playable||editable,w=m.done?winnerOf(m):null;
  const showSc=m.done&&(!m.bye||x.kind==='swiss'||x.kind==='melee');
  const side=(id,sc)=>`<div class="m-side ${m.done&&!m.bye?(id===w?'win':'lose'):''}">${teamLine(t,id)}<span class="sc">${showSc?sc:''}</span></div>`;
  const bSide=m.bye?`<div class="m-side"><span class="tl tbd"><span class="boule sm ghost" aria-hidden="true"></span><span class="tl-txt"><b>Exempte</b><small>${x.kind==='swiss'||x.kind==='melee'?'Victoire attribuée':'Qualifiée d’office'}</small></span></span><span class="sc">${x.kind==='swiss'||x.kind==='melee'?m.sb:''}</span></div>`:side(m.b,m.sb);
  const ta=team(t,m.a),tb=team(t,m.b);
  const s=[ta&&ta.chef,tb&&tb.chef,ta&&ta.club,tb&&tb.club,ta&&ta.n,tb&&tb.n,...(ta?ta.players:[]),...(tb?tb.players:[])].filter(Boolean).join(' ').toLowerCase();
  let terr;
  if(m.bye)terr='<span class="terrain blank" aria-hidden="true"></span>';
  else if(m.done)terr=`<span class="terrain fin" aria-label="Terminée">${ic('check')}</span>`;
  else if(m.terrain)terr=`<span class="terrain" aria-label="Terrain ${m.terrain}">${m.terrain}</span>`;
  else terr=`<span class="terrain none">${playable?'sans terrain':'à venir'}</span>`;
  const attrs=tap?`data-act="score" data-mid="${m.id}" role="button" tabindex="0" aria-label="${esc(`${ta?ta.chef:''} contre ${tb?tb.chef:''} : ${m.done?'modifier le score':'saisir le score'}`)}"`:'';
  return `<div class="match ${m.done?'done':''} ${tap?'tap':''}" data-s="${esc(s)}" ${attrs}>${o.ctx?`<div class="m-ctx">${esc(x.title)}, ${esc(x.sub)}</div>`:''}${x.clash?'<div class="m-warn">Même club : rencontre impossible à éviter</div>':''}${m.absent?'<div class="m-warn">Partie à blanc : équipe absente, victoire par forfait</div>':''}<div class="m-body">${terr}<div class="m-sides">${side(m.a,m.sa)}${bSide}</div></div></div>`;
}
/* Points 11 ou 13 : modifiables entre deux rondes (suisse) ou à tout moment (autres formules) */
function pushRonde(t,ri){t.groups.forEach(g=>{const r=swissPair(t,g,ri);r.points=+t.settings.points;g.rounds.push(r);});}
function refreshRoundPoints(t){(t.brackets||[]).forEach(b=>{const r=b.rounds[b.rounds.length-1];if(r&&!roundDone(r))r.points=pointsFor(t,b,r.n||r.matches.length*2);});}
function setPoints(t,v){const s=t.settings;if(t.format!=='elim'&&getB(t,'F'))s.finalPoints=v;else s.points=v;refreshRoundPoints(t);}
function pointsBar(t){
  if(!t.started||finished(t))return '';
  const s=t.settings,F=getB(t,'F');let label,cur,hint;
  if(t.format==='melee'){const k=(t.mrounds||[]).length;if(k>=(+s.rounds||4))return '';label=`Partie ${k+1} en`;cur=+s.points;hint=k&&!meleeComplete(t)?`La partie ${k} en cours reste en ${t.mrounds[k-1].points||s.points} points.`:'';}
  else if(t.format==='suisse'&&!F){
    if(t.swissRound>=swissTotal(t))return '';
    const r=t.swissRound>0&&t.groups[0].rounds[t.swissRound-1];
    label=`Ronde ${t.swissRound+1} en`;cur=+s.points;
    hint=r&&!swissRoundComplete(t)?`La ronde ${t.swissRound} en cours reste en ${r.points||s.points} points.`:'';
  }else if(t.format!=='elim'&&F){label='Phase finale en';cur=+s.finalPoints;hint='S’applique tout de suite aux parties non terminées.';}
  else{label=t.format==='poules'?'Parties de poule en':'Parties en';cur=+s.points;hint='S’applique tout de suite aux parties non terminées.';}
  if(s.quarter13&&(t.format==='elim'||F))hint+=' Les quarts, demies et finale restent en 13 points (réglage).';
  return `<div class="ptsbar"><span class="flabel">${label}</span><div class="seg" role="group" aria-label="${label}">${[11,13].map(v=>`<button type="button" data-act="setPts" data-v="${v}" aria-pressed="${cur===v}" class="${cur===v?'on':''}">${v} points</button>`).join('')}</div>${hint?`<small class="muted">${hint}</small>`:''}</div>`;
}
/* Avancement des rondes : une ronde ne s’ouvre qu’après la saisie de tous les scores de la précédente, puis son tirage */
function rondeCount(t,ri){let d=0,a=0;(t.groups||[]).forEach(g=>{const r=g.rounds[ri];if(r)r.matches.forEach(m=>{if(m.bye)return;a++;if(m.done)d++;});});return{d,a};}
function roundInfo(t){
  if(t.format==='melee'&&t.started)return{N:+t.settings.rounds||4,k:(t.mrounds||[]).length,complete:meleeComplete(t),count:i=>{const ms=(t.mrounds[i]||{matches:[]}).matches.filter(m=>!m.bye);return{d:ms.filter(m=>m.done).length,a:ms.length};},w:'Partie',s:'P'};
  if(t.format==='suisse'&&t.groups&&!getB(t,'F'))return{N:swissTotal(t),k:t.swissRound,complete:swissRoundComplete(t),count:i=>rondeCount(t,i),w:'Ronde',s:'R'};
  return null;
}
function rondeStepper(t){
  const R=roundInfo(t);if(!R)return '';const items=[];
  for(let i=0;i<R.N;i++){
    let cls='todo',txt=`${R.s}${i+1}`,title=`${R.w} ${i+1} : pas encore tirée`;
    if(i<R.k-1||(i===R.k-1&&R.complete)){cls='done';txt=`${ic('check')}${R.s}${i+1}`;title=`${R.w} ${i+1} terminée`;}
    else if(i===R.k-1){const c=R.count(i);cls='cur';txt=`${R.w} ${i+1} : ${c.d}/${c.a} scores`;title=`${R.w} ${i+1} en cours`;}
    else if(i===R.k&&(R.k===0||R.complete)){cls='next';txt=`${R.s}${i+1} à tirer`;title=`${R.w} ${i+1} prête à être tirée`;}
    items.push(`<span class="step ${cls}" title="${title}">${txt}</span>`);
  }
  return `<div class="steps" role="list" aria-label="Avancement">${items.map(x=>`<span role="listitem">${x}</span>`).join('')}</div>`;
}
function scoreAllowed(t,x){
  if(x.kind==='swiss')return x.ri===t.swissRound-1&&!getB(t,'F');
  if(x.kind==='melee')return x.ri===(t.mrounds||[]).length-1;
  if(x.kind==='ko')return x.ri===x.b.rounds.length-1;
  return true;
}
function actionsCard(t){

}

function tabsFor(t){
  const T=[{id:'equipes',label:'Équipes',icon:'users'},{id:'jouer',label:'À jouer',icon:'play'}];
  if(t.format==='elim')T.push({id:'tableaux',label:'Tableaux',icon:'tree'});
  if(t.format==='poules')T.push({id:'poules',label:'Poules',icon:'grid'},{id:'finale',label:'Finale',icon:'trophy'});
  if(t.format==='suisse'){T.push({id:'classement',label:'Classement',icon:'list'});if(finalQ(t))T.push({id:'finale',label:'Finale',icon:'trophy'});}
  if(t.format==='melee'){T[0].label='Joueurs';T.push({id:'classement',label:'Classement',icon:'list'});}
  T.push({id:'clubs',label:'Clubs',icon:'club'});
